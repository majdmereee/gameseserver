<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X O أونلاين 🎮</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e24;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { color: #00ffcc; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        input {
            width: 85%; padding: 15px; margin: 20px 0;
            border: 2px solid #00ffcc; background: #121212;
            color: #fff; border-radius: 8px; outline: none;
            font-size: 16px; text-align: center;
        }
        input:focus { box-shadow: 0 0 10px #00ffcc; }
        button {
            padding: 15px 25px; background: #00ffcc; color: #000;
            border: none; border-radius: 8px; font-weight: bold;
            font-size: 18px; cursor: pointer; transition: 0.3s;
            width: 95%; margin-top: 10px;
        }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        
        /* تصميم لوحة اللعبة (نيون) */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
        }
        .cell {
            background: #2a2a35;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .cell:hover { background: #3a3a45; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
        .x-color { color: #00ffcc; text-shadow: 0 0 20px #00ffcc; }
        .o-color { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        
        #gameArea { display: none; }
        #status { margin: 15px 0; font-size: 1.3em; font-weight: bold; color: #ffcc00; }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div class="container" id="loginArea">
        <h1>لعبة X O أونلاين 🎮</h1>
        <p style="color: #aaa;">أدخل اسمك لتبدأ التحدي!</p>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." required>
        <button onclick="joinGame()" id="joinBtn">دخول اللعبة 🚀</button>
    </div>

    <!-- شاشة اللعب -->
    <div class="container" id="gameArea">
        <h1>X O 🔥</h1>
        <div id="status">جاري الاتصال بالسيرفر...</div>
        
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket;
        let myName = "";
        let mySymbol = ""; // 'X' أو 'O'
        let currentTurn = "X"; // اللعبة دائماً تبدأ بـ X
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let gameOver = false;

        // تم تثبيت رابط السيرفر هنا مباشرة
        const SERVER_URL = 'https://render-kr1o.onrender.com/';

        function joinGame() {
            myName = document.getElementById('playerName').value.trim();
            
            if (!myName) {
                alert("الرجاء إدخال اسمك أولاً!");
                return;
            }

            document.getElementById('joinBtn').innerText = "جاري الاتصال...";
            
            // الاتصال بالسيرفر
            socket = io(SERVER_URL);

            socket.on('connect', () => {
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('status').innerText = "تم الاتصال 🟢! أول شخص يلعب يكون X";
            });

            // استقبال البيانات من اللاعب الآخر
            socket.on('otherPlayerMoved', (data) => {
                if (data.type === 'move') {
                    // تحديث اللوحة بحركة الخصم
                    boardState[data.index] = data.symbol;
                    updateBoardUI();
                    
                    // إذا لم يكن لدي رمز بعد، والخصم لعب X، أنا أصبح O
                    if (!mySymbol) mySymbol = (data.symbol === 'X') ? 'O' : 'X';

                    currentTurn = (data.symbol === 'X') ? 'O' : 'X';
                    checkWin(data.symbol, data.name);
                } 
                else if (data.type === 'chat') {
                    // استقبال رسالة الخسارة من الخصم (آلية "تصبح على خير")
                    alert(`رسالة من ${data.name}:\n\n${data.message}`);
                    document.getElementById('status').innerText = `${data.name} يقول: ${data.message}`;
                    document.getElementById('status').style.color = "#00ffcc";
                }
            });

            socket.on('connect_error', () => {
                alert("تعذر الاتصال بالسيرفر، تأكد أن السيرفر يعمل على Render.");
                document.getElementById('joinBtn').innerText = "دخول اللعبة 🚀";
            });
        }

        function makeMove(index) {
            if (gameOver || boardState[index] !== "") return; // منع اللعب بمربع ممتلئ
            
            // إذا كان لدي رمز، لكن ليس دوري
            if (mySymbol && currentTurn !== mySymbol) {
                return alert("ليس دورك! انتظر الخصم.");
            }

            // إذا كانت أول حركة في اللعبة، اللاعب الذي يضغط أولاً يكون X
            if (!mySymbol) mySymbol = currentTurn;

            // تنفيذ الحركة
            boardState[index] = mySymbol;
            updateBoardUI();

            // إرسال الحركة للخصم عبر السيرفر
            socket.emit('playerMoved', { 
                type: 'move', 
                index: index, 
                symbol: mySymbol, 
                name: myName 
            });

            currentTurn = (mySymbol === 'X') ? 'O' : 'X';
            checkWin(mySymbol, myName);
        }

        function updateBoardUI() {
            const cells = document.getElementsByClassName('cell');
            for (let i = 0; i < 9; i++) {
                cells[i].innerText = boardState[i];
                cells[i].className = "cell " + (boardState[i] === 'X' ? "x-color" : (boardState[i] === 'O' ? "o-color" : ""));
            }
        }

        function checkWin(lastSymbol, lastPlayerName) {
            const winConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // أفقي
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // عمودي
                [0, 4, 8], [2, 4, 6]             // قطري
            ];

            let won = false;
            for (let combo of winConditions) {
                if (boardState[combo[0]] && boardState[combo[0]] === boardState[combo[1]] && boardState[combo[1]] === boardState[combo[2]]) {
                    won = true;
                    break;
                }
            }

            if (won) {
                gameOver = true;
                if (lastSymbol === mySymbol) {
                    document.getElementById('status').innerText = "🎉 مبروك! لقد فزت!";
                    document.getElementById('status').style.color = "#00ffcc";
                } else {
                    document.getElementById('status').innerText = "💀 لقد خسرت!";
                    document.getElementById('status').style.color = "#ff0055";
                    
                    // إرسال رسالة "تصبح على خير" تلقائياً للفائز
                    const msg = `تصبح على خير يا ${lastPlayerName} 😴`;
                    socket.emit('playerMoved', { type: 'chat', message: msg, name: myName });
                }
            } else if (!boardState.includes("")) {
                gameOver = true;
                document.getElementById('status').innerText = "🤝 تعادل!";
            } else {
                if (mySymbol) {
                    document.getElementById('status').innerText = (currentTurn === mySymbol) ? "دورك الآن! إلعب" : "انتظر دور الخصم...";
                }
            }
        }
    </script>
</body>
</html>
