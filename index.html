<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوكي نيون أونلاين 🏑</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; }
        .container { background: #1e1e24; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,204,0.1); text-align: center; width: 90%; max-width: 450px; z-index: 10; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); margin-bottom: 5px; }
        .input-group { display: flex; gap: 10px; margin: 15px 0; }
        input { flex: 1; padding: 12px; border: 2px solid #555; background: #121212; color: #fff; border-radius: 8px; text-align: center; outline: none;}
        input:focus { border-color: #00ffcc; }
        .btn-container { display: flex; gap: 10px; justify-content: center; margin-top: 10px;}
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; flex: 1; transition: 0.3s; color:#000;}
        .btn-p1 { background: #00ffcc; box-shadow: 0 0 10px #00ffcc; }
        .btn-p2 { background: #ff0055; box-shadow: 0 0 10px #ff0055; color: #fff;}
        button:hover { filter: brightness(1.2); }
        
        #gameArea { display: none; flex-direction: column; align-items: center; }
        #status { margin: 10px 0; font-size: 1.1em; font-weight: bold; color: #ffcc00; }
        .score-board { display: flex; justify-content: space-between; width: 100%; max-width: 400px; font-size: 1.5em; font-weight: bold; margin-bottom: 10px; }
        .score-p2 { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .score-p1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        canvas { background: #1a1a24; border: 3px solid #333; border-radius: 10px; box-shadow: inset 0 0 20px #000; max-width: 100%; }
    </style>
</head>
<body>

    <div class="container" id="loginArea">
        <h1>هوكي نيون 🏑</h1>
        <p style="color: #aaa; font-size: 14px;">أنت وصديقك اكتبوا نفس رقم الغرفة لتدخلوا مع بعض</p>
        
        <div class="input-group">
            <input type="text" id="playerName" placeholder="اسمك..." required>
            <input type="number" id="roomCode" placeholder="رقم الغرفة (مثال: 123)" required>
        </div>

        <div class="btn-container">
            <button onclick="joinGame(1)" class="btn-p1">لاعب 1 (أزرق)</button>
            <button onclick="joinGame(2)" class="btn-p2">لاعب 2 (أحمر)</button>
        </div>
    </div>

    <div id="gameArea">
        <div class="score-board">
            <div class="score-p2" id="score2">0 (الخصم)</div>
            <div id="status">جاري الاتصال...</div>
            <div class="score-p1" id="score1">(أنت) 0</div>
        </div>
        <canvas id="hockeyBoard" width="400" height="600"></canvas>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // رابط السيرفر الأساسي اللي شغال عندك
        const SERVER_URL = 'https://render-kr1o.onrender.com/';
        let socket;
        let myName = "", myRoom = "", opponentName = "الخصم";
        let myRole = 0; // 1 = أزرق (المضيف), 2 = أحمر
        let gameOver = false;
        let lastOpponentPing = Date.now();

        const canvas = document.getElementById('hockeyBoard');
        const ctx = canvas.getContext('2d');
        
        let p1 = { x: 200, y: 520, r: 25, score: 0 }; 
        let p2 = { x: 200, y: 80, r: 25, score: 0 };  
        let puck = { x: 200, y: 300, r: 15, dx: 0, dy: 0 };
        const goalWidth = 140;

        function joinGame(role) {
            myName = document.getElementById('playerName').value.trim();
            myRoom = document.getElementById('roomCode').value.trim();
            
            if (!myName || !myRoom) return alert("الرجاء كتابة اسمك ورقم الغرفة!");

            myRole = role;
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';

            if(myRole === 2) {
                document.getElementById('score2').innerText = "(أنت) 0";
                document.getElementById('score1').innerText = "0 (الخصم)";
            }

            socket = io(SERVER_URL);
            socket.on('connect', () => { document.getElementById('status').innerText = `متصل بالغرفة ${myRoom} 🟢`; });

            // استقبال حركات اللاعبين
            socket.on('otherPlayerMoved', (data) => {
                // الفلتر السحري: إذا البيانات مو من نفس غرفتي، تجاهلها تماماً!
                if (data.room !== myRoom) return;
                
                lastOpponentPing = Date.now(); // الخصم موجود وما فصل
                opponentName = data.name;

                if (data.type === 'sync') {
                    if (myRole === 1 && data.role === 2) {
                        p2.x = data.px2; p2.y = data.py2;
                    } 
                    else if (myRole === 2 && data.role === 1) {
                        p1.x = data.px1; p1.y = data.py1;
                        puck.x = data.puckX; puck.y = data.puckY;
                        p1.score = data.s1; p2.score = data.s2;
                        updateScores();
                        checkWin();
                    }
                } 
                else if (data.type === 'chat') {
                    alert(`رسالة من ${data.name}:\n\n${data.message}`);
                    document.getElementById('status').innerText = `${data.name}: ${data.message}`;
                }
            });

            // تحديث اللعبة 40 مرة بالثانية
            setInterval(gameLoop, 1000 / 40); 
        }

        function movePaddle(clientX, clientY) {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            let mx = (clientX - rect.left) * (canvas.width / rect.width);
            let my = (clientY - rect.top) * (canvas.height / rect.height);

            if (myRole === 1) {
                p1.x = Math.max(p1.r, Math.min(canvas.width - p1.r, mx));
                p1.y = Math.max(canvas.height/2 + p1.r, Math.min(canvas.height - p1.r, my));
            } else {
                p2.x = Math.max(p2.r, Math.min(canvas.width - p2.r, mx));
                p2.y = Math.max(p2.r, Math.min(canvas.height/2 - p2.r, my));
            }
        }

        canvas.addEventListener('mousemove', (e) => movePaddle(e.clientX, e.clientY));
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); movePaddle(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        function collide(paddle, p) {
            let dx = p.x - paddle.x, dy = p.y - paddle.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < paddle.r + p.r) {
                let angle = Math.atan2(dy, dx);
                let speed = Math.sqrt(p.dx*p.dx + p.dy*p.dy) + 3;
                if (speed > 15) speed = 15;
                p.dx = Math.cos(angle) * speed; p.dy = Math.sin(angle) * speed;
                p.x = paddle.x + Math.cos(angle) * (paddle.r + p.r + 1);
                p.y = paddle.y + Math.sin(angle) * (paddle.r + p.r + 1);
            }
        }

        function gameLoop() {
            if (gameOver || !socket) return;

            // حماية من الانسحاب: إذا الخصم ما بعت شيء لـ 3 ثواني
            if (Date.now() - lastOpponentPing > 3000 && opponentName !== "الخصم") {
                gameOver = true;
                alert("انسحب الخصم أو انقطع اتصاله!");
                document.getElementById('status').innerText = "الخصم غادر الغرفة 🏃‍♂️";
                return;
            }

            if (myRole === 1) {
                puck.x += puck.dx; puck.y += puck.dy;
                puck.dx *= 0.99; puck.dy *= 0.99; // احتكاك

                if (puck.x - puck.r < 0) { puck.x = puck.r; puck.dx *= -1; }
                if (puck.x + puck.r > canvas.width) { puck.x = canvas.width - puck.r; puck.dx *= -1; }

                let goalLeft = (canvas.width - goalWidth) / 2, goalRight = goalLeft + goalWidth;

                if (puck.y - puck.r < 0) {
                    if (puck.x > goalLeft && puck.x < goalRight) { p1.score++; resetPuck(); checkWin(); } 
                    else { puck.y = puck.r; puck.dy *= -1; }
                }
                if (puck.y + puck.r > canvas.height) {
                    if (puck.x > goalLeft && puck.x < goalRight) { p2.score++; resetPuck(); checkWin(); } 
                    else { puck.y = canvas.height - puck.r; puck.dy *= -1; }
                }

                collide(p1, puck); collide(p2, puck);

                // إرسال البيانات وإرفاق "رقم الغرفة" معها
                socket.emit('playerMoved', { type: 'sync', room: myRoom, role: 1, name: myName, px1: p1.x, py1: p1.y, puckX: puck.x, puckY: puck.y, s1: p1.score, s2: p2.score });
            } 
            else if (myRole === 2) {
                // إرسال بيانات اللاعب الثاني مع "رقم الغرفة"
                socket.emit('playerMoved', { type: 'sync', room: myRoom, role: 2, name: myName, px2: p2.x, py2: p2.y });
            }
            draw();
        }

        function resetPuck() { puck.x = 200; puck.y = 300; puck.dx = 0; puck.dy = 0; }

        function updateScores() {
            if(myRole === 1) {
                document.getElementById('score1').innerText = `(أنت) ${p1.score}`;
                document.getElementById('score2').innerText = `${p2.score} (${opponentName})`;
            } else {
                document.getElementById('score2').innerText = `(أنت) ${p2.score}`;
                document.getElementById('score1').innerText = `${p1.score} (${opponentName})`;
            }
        }

        function checkWin() {
            if (gameOver) return;
            if (p1.score >= 3 || p2.score >= 3) {
                gameOver = true;
                let iWon = (p1.score >= 3 && myRole === 1) || (p2.score >= 3 && myRole === 2);
                let winnerName = (p1.score >= 3) ? (myRole === 1 ? myName : opponentName) : (myRole === 2 ? myName : opponentName);
                
                if (iWon) {
                    document.getElementById('status').innerText = "🎉 مبروك! لقد فزت!";
                } else {
                    document.getElementById('status').innerText = "💀 لقد خسرت!";
                    // رسالة تصبح على خير
                    socket.emit('playerMoved', { type: 'chat', room: myRoom, message: `تصبح على خير يا ${winnerName} 😴`, name: myName });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(400, 300); ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(200, 300, 50, 0, Math.PI * 2); ctx.stroke();
            
            ctx.fillStyle = 'rgba(255, 0, 85, 0.2)'; ctx.fillRect(130, 0, 140, 10);
            ctx.fillStyle = 'rgba(0, 255, 204, 0.2)'; ctx.fillRect(130, 590, 140, 10);

            ctx.beginPath(); ctx.arc(p1.x, p1.y, p1.r, 0, Math.PI * 2); ctx.fillStyle = '#00ffcc'; ctx.fill();
            ctx.beginPath(); ctx.arc(p2.x, p2.y, p2.r, 0, Math.PI * 2); ctx.fillStyle = '#ff0055'; ctx.fill();
            ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2); ctx.fillStyle = '#ffcc00'; ctx.fill();
        }
        draw();
    </script>
</body>
</html>
