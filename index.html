<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia AI - المافيا الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981; --primary-glow: rgba(16, 185, 129, 0.5);
            --danger: #f43f5e; --danger-glow: rgba(244, 63, 94, 0.5);
            --info: #3b82f6; --info-glow: rgba(59, 130, 246, 0.5);
            --warning: #f59e0b;
            --bg-night: linear-gradient(135deg, #020617, #0f172a, #1e1b4b);
            --bg-day: linear-gradient(135deg, #e0f2fe, #f0f9ff, #fed7aa);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.day-mode {
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #0f172a;
            --text-muted: #475569;
            background: var(--bg-day);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-night);
            color: var(--text-main);
            min-height: 100vh; overflow: hidden;
            transition: background 2s var(--ease-fluid), color 1s ease;
            display: flex; align-items: center; justify-content: center;
        }

        /* Live Particles Background */
        #particles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
            opacity: 0.4; transition: opacity 2s var(--ease-fluid);
        }

        .app-container { width: 100%; height: 100vh; max-width: 1400px; position: relative; z-index: 1; perspective: 1200px; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden;
            transform: translate3d(0, 30px, 0) scale(0.95);
            transition: all 0.7s var(--ease-fluid);
            padding: 20px; display: flex; flex-direction: column;
        }
        .screen.active { opacity: 1; visibility: visible; transform: translate3d(0, 0, 0) scale(1); z-index: 10; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); transform: translateZ(0);
        }

        .btn {
            font-family: inherit; font-weight: 800; font-size: 1.1rem; padding: 16px 32px;
            border: none; border-radius: 16px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
            transition: 0.3s var(--ease-fluid); position: relative; overflow: hidden;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 25px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-4px); box-shadow: 0 12px 35px var(--primary-glow); }
        .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 8px 25px var(--danger-glow); }
        .btn-danger:hover { transform: translateY(-4px); box-shadow: 0 12px 35px var(--danger-glow); }

        .input-group { position: relative; margin-bottom: 24px; }
        .input-group label { display: block; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 18px 24px; background: rgba(0,0,0,0.2);
            border: 2px solid var(--glass-border); border-radius: 16px;
            color: inherit; font-family: inherit; font-size: 1.1rem; font-weight: 600;
            transition: 0.3s var(--ease-fluid);
        }
        body.day-mode .input-group input { background: rgba(255,255,255,0.7); }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); outline: none; }

        /* Layout */
        #loginScreen { align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 480px; padding: 40px; }
        .game-layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; height: calc(100vh - 40px); }
        @media (max-width: 1024px) { .game-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .sidebar { max-height: 40vh; } }

        /* Role Card */
        .sidebar { display: flex; flex-direction: column; gap: 24px; }
        .role-scene { height: 200px; perspective: 1200px; cursor: pointer; }
        .role-card { width: 100%; height: 100%; position: relative; transition: transform 0.8s var(--ease-fluid); transform-style: preserve-3d; border-radius: 24px; }
        .role-card.is-flipped { transform: rotateY(180deg); }
        .role-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 24px; border: 1px solid var(--glass-border); }
        .role-front { background: rgba(30, 41, 59, 0.8); }
        .role-back { transform: rotateY(180deg); background: var(--primary); color: #fff; }

        /* Players */
        .players-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 20px; }
        .players-list { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .player-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; margin-bottom: 10px; background: rgba(0,0,0,0.15);
            border-radius: 16px; border: 1px solid transparent; transition: 0.3s;
        }
        body.day-mode .player-item { background: rgba(255,255,255,0.4); }
        .player-item.is-dead { opacity: 0.5; filter: grayscale(1); background: rgba(244, 63, 94, 0.1); border-color: var(--danger-glow); text-decoration: line-through; }

        /* Chat */
        .main-arena { display: flex; flex-direction: column; gap: 24px; overflow: hidden; }
        .header-controls { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; }
        .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
        
        .msg-bubble { max-width: 80%; padding: 16px 20px; border-radius: 20px; font-size: 1.1rem; line-height: 1.6; font-weight: 500; animation: fadeInUp 0.4s var(--ease-fluid) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .msg-meta { font-size: 0.85rem; font-weight: 800; opacity: 0.7; margin-bottom: 6px; display: block; }
        .msg-me { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px var(--primary-glow); }
        .msg-other { background: rgba(255,255,255,0.1); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        body.day-mode .msg-other { background: #fff; }
        .msg-system { align-self: center; color: var(--warning); font-weight: 800; padding: 10px 24px; border: 1px dashed var(--warning); border-radius: 30px; }
        
        .chat-input-area { padding: 20px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--glass-border); display: flex; gap: 16px; }
        body.day-mode .chat-input-area { background: rgba(255,255,255,0.5); }
        .chat-input-area input { flex: 1; padding: 18px 24px; border-radius: 24px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: inherit; font-family: inherit; font-size: 1.1rem; }
        .btn-send { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px var(--primary-glow); transition: 0.2s; }
        
        /* Overlays */
        .cinematic-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9);
            z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff;
        }
        .cinematic-overlay.active { display: flex; animation: cinematicOverlay 3.5s var(--ease-fluid) forwards; }
        @keyframes cinematicOverlay { 0% { opacity: 0; filter: blur(10px); transform: scale(1.1); } 15% { opacity: 1; filter: blur(0); transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); pointer-events: none; } }
        
        .vote-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); z-index: 50; display: none;
            flex-direction: column; align-items: center; justify-content: center; border-radius: 24px;
            opacity: 0; transform: scale(0.95); transition: all 0.5s var(--ease-fluid);
        }
        .vote-modal.active { display: flex; opacity: 1; transform: scale(1); }
        .vote-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; width: 80%; margin-top: 30px; }
        .vote-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--danger); padding: 20px; border-radius: 16px; color: #fff; font-family: inherit; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .vote-btn:hover { background: var(--danger); box-shadow: 0 0 25px var(--danger-glow); transform: translateY(-5px); }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="toast-container" id="toastContainer" style="position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:1000;"></div>

    <div class="cinematic-overlay" id="cinematicOverlay">
        <i id="cinematicIcon" class="fa-solid fa-sun" style="font-size: 6rem; margin-bottom: 20px;"></i>
        <h1 id="cinematicText" style="font-size: 5rem; font-weight: 900;">النهار</h1>
    </div>

    <div class="app-container">
        <!-- Login -->
        <div id="loginScreen" class="screen active">
            <div class="login-card glass-panel">
                <div style="text-align:center; margin-bottom:40px;">
                    <i class="fa-solid fa-mask" style="font-size: 4rem; color: var(--primary);"></i>
                    <h1 style="font-size: 2.5rem; font-weight: 900; margin-top:10px;">المافيا الذكية</h1>
                </div>
                <div class="input-group">
                    <label>مفتاح Gemini API (مطلوب لتشغيل الوعي)</label>
                    <input type="password" id="apiKey" placeholder="AI Key...">
                </div>
                <div class="input-group">
                    <label>اسم اللاعب</label>
                    <input type="text" id="playerName" placeholder="أدخل اسمك...">
                </div>
                <button class="btn btn-primary" style="width: 100%" onclick="GameApp.joinLobby()">بدء اللعب</button>
            </div>
        </div>

        <!-- Game -->
        <div id="gameScreen" class="screen">
            <div class="game-layout">
                <div class="sidebar">
                    <div class="role-scene" onclick="this.querySelector('.role-card').classList.toggle('is-flipped')">
                        <div class="role-card" id="roleCard">
                            <div class="role-face role-front">
                                <i class="fa-solid fa-fingerprint" style="font-size: 3.5rem; color: var(--primary);"></i>
                                <h3 style="margin-top:15px;">بطاقة الهوية</h3>
                            </div>
                            <div class="role-face role-back" id="roleBackUI">
                                <i id="roleIcon" class="fa-solid fa-user" style="font-size: 3.5rem;"></i>
                                <h2 id="roleTitle" style="font-size: 2rem; margin:10px 0;">مدني</h2>
                                <p id="roleDesc">العب بذكاء</p>
                            </div>
                        </div>
                    </div>
                    <div class="players-panel glass-panel">
                        <h3 style="margin-bottom:15px; border-bottom:1px solid var(--glass-border); padding-bottom:10px;">القرية</h3>
                        <div class="players-list" id="playersListUI"></div>
                    </div>
                </div>

                <div class="main-arena glass-panel">
                    <div class="header-controls">
                        <div id="phaseUI" style="font-size: 1.5rem; font-weight: 800; display:flex; gap:10px; align-items:center;">
                            <i class="fa-solid fa-hourglass-half"></i> غرفة الانتظار
                        </div>
                        <button class="btn btn-primary" id="startBtnUI" onclick="GameApp.hostStartGame()">بدء اللعبة (توليد الذكاء)</button>
                    </div>

                    <div class="chat-container">
                        <div class="vote-modal" id="voteModalUI">
                            <h2 style="color:var(--danger); font-size:2.5rem; margin-bottom:20px;">المحكمة</h2>
                            <div class="vote-grid" id="voteGridUI"></div>
                        </div>
                        <div class="chat-messages" id="chatMessagesUI"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInputUI" placeholder="تحدث..." onkeypress="if(event.key === 'Enter') GameApp.sendMessage()">
                            <button class="btn-send" onclick="GameApp.sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Particles Animation Logic
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * -1 - 0.5;
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('day-mode') ? 'rgba(245, 158, 11, 0.4)' : 'rgba(96, 165, 250, 0.4)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for(let i=0; i<70; i++) particlesArray.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // System Core
        const GameApp = (() => {
            const BOT_PROFILES = {
                "آدم (AI)": "شخصية هجومية وعصبية، يتهم الناس بسرعة، يتحدث بلهجة سورية حادة.",
                "سارة (AI)": "هادئة جداً ومحللة، تحاول ربط الأحداث، كلامها قليل ومركز.",
                "زين (AI)": "ساخر ومستفز، يضحك في المواقف الصعبة، لا يأخذ الأمور بجدية.",
                "ليلى (AI)": "خائفة دائماً، تدافع عن نفسها وتشك بالجميع حتى لو لم يتهمها أحد.",
                "عمر (AI)": "يدعي الحكمة، يتحدث بثقة زائدة وكأنه المحقق الفعلي."
            };

            const ROLES = {
                'مافيا': { icon: 'fa-user-ninja', bg: 'linear-gradient(135deg, #be123c, #881337)' },
                'طبيب': { icon: 'fa-user-md', bg: 'linear-gradient(135deg, #2563eb, #1e3a8a)' },
                'محقق': { icon: 'fa-user-secret', bg: 'linear-gradient(135deg, #7c3aed, #4c1d95)' },
                'مدني': { icon: 'fa-user-shield', bg: 'linear-gradient(135deg, #059669, #064e3b)' }
            };

            let state = {
                name: '', apiKey: '', isHost: true, myRole: null, isAlive: true,
                phase: 'lobby', dayCount: 1, players: [], chatHistory: []
            };

            const UI = {
                addMsg(sender, text, type='normal') {
                    const div = document.createElement('div');
                    if (type === 'system') div.className = 'msg-system';
                    else div.className = `msg-bubble ${sender === state.name ? 'msg-me' : 'msg-other'}`;
                    
                    div.innerHTML = type === 'system' ? text : `<span class="msg-meta">${sender}</span>${text}`;
                    document.getElementById('chatMessagesUI').appendChild(div);
                    div.scrollIntoView({behavior: 'smooth'});
                    
                    if(type === 'normal') state.chatHistory.push(`${sender}: ${text}`);
                    if(state.chatHistory.length > 15) state.chatHistory.shift();
                },
                updatePlayers() {
                    const list = document.getElementById('playersListUI');
                    list.innerHTML = '';
                    state.players.forEach(p => {
                        list.innerHTML += `<div class="player-item ${p.alive?'':'is-dead'}">
                            <span>${p.type==='bot'?'<i class="fa-solid fa-robot"></i>':'<i class="fa-solid fa-user"></i>'} ${p.name}</span>
                        </div>`;
                    });
                },
                setPhase(phase) {
                    state.phase = phase;
                    const overlay = document.getElementById('cinematicOverlay');
                    overlay.classList.remove('active'); void overlay.offsetWidth;
                    
                    if (phase === 'day') {
                        document.body.classList.add('day-mode');
                        document.getElementById('cinematicIcon').className = 'fa-solid fa-sun text-warning';
                        document.getElementById('cinematicText').innerText = `النهار ${state.dayCount}`;
                        document.getElementById('phaseUI').innerHTML = '<i class="fa-solid fa-sun"></i> نهار';
                    } else if (phase === 'night') {
                        document.body.classList.remove('day-mode');
                        document.getElementById('cinematicIcon').className = 'fa-solid fa-moon text-info';
                        document.getElementById('cinematicText').innerText = `الليل ${state.dayCount}`;
                        document.getElementById('phaseUI').innerHTML = '<i class="fa-solid fa-moon"></i> ليل';
                    }
                    overlay.classList.add('active');
                }
            };

            const Host = {
                startGame() {
                    if(!state.apiKey) return alert("أدخل مفتاح الـ API");
                    const botNames = Object.keys(BOT_PROFILES);
                    
                    botNames.forEach(n => state.players.push({name: n, type: 'bot', alive: true}));
                    const roles = ['مافيا', 'محقق', 'طبيب', 'مدني', 'مافيا', 'مدني'].sort(() => Math.random() - 0.5);
                    state.players.forEach((p, i) => p.role = roles[i]);
                    
                    const me = state.players.find(p => p.name === state.name);
                    state.myRole = me.role;
                    document.getElementById('roleBackUI').style.background = ROLES[me.role].bg;
                    document.getElementById('roleIcon').className = `fa-solid ${ROLES[me.role].icon}`;
                    document.getElementById('roleTitle').innerText = me.role;
                    
                    document.getElementById('startBtnUI').style.display = 'none';
                    UI.updatePlayers();
                    UI.addMsg('النظام', 'بدأت اللعبة! تم توزيع الأدوار.', 'system');
                    
                    setTimeout(() => this.runDay(), 3000);
                },

                runDay() {
                    UI.setPhase('day');
                    UI.addMsg('النظام', 'استيقظت القرية. تناقشوا للبحث عن المافيا!', 'system');
                    this.triggerBots();
                },

                async triggerBots() {
                    const aliveBots = state.players.filter(p => p.type === 'bot' && p.alive);
                    const aliveNames = state.players.filter(p => p.alive).map(p => p.name).join('، ');
                    const context = state.chatHistory.slice(-5).join(' | ');

                    for (let i = 0; i < aliveBots.length; i++) {
                        const bot = aliveBots[i];
                        const prompt = `أنت تلعب لعبة المافيا. اسمك: ${bot.name}. دورك الحقيقي: ${bot.role} (أخفه عن الباقين إلا إذا لزم الأمر). 
                        شخصيتك: ${BOT_PROFILES[bot.name]}. 
                        اللاعبون الأحياء: ${aliveNames}. 
                        سجل المحادثة الأخير: [${context}]. 
                        رد بجملة واحدة فقط باللهجة السورية بناءً على سياق المحادثة وشخصيتك. لا تكتب اسمك في البداية.`;

                        // Staggering bot responses
                        setTimeout(async () => {
                            try {
                                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.apiKey}`, {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                                });
                                const data = await res.json();
                                const text = data.candidates[0].content.parts[0].text.replace(/["']/g, "").trim();
                                UI.addMsg(bot.name, text);
                            } catch (e) {
                                console.error(e);
                            }
                        }, i * 6000 + Math.random() * 2000); 
                    }
                }
            };

            return {
                joinLobby() {
                    state.name = document.getElementById('playerName').value || 'اللاعب';
                    state.apiKey = document.getElementById('apiKey').value;
                    state.players.push({name: state.name, type: 'human', alive: true});
                    
                    document.getElementById('loginScreen').classList.remove('active');
                    document.getElementById('gameScreen').classList.add('active');
                    UI.updatePlayers();
                },
                hostStartGame: () => Host.startGame(),
                sendMessage() {
                    const val = document.getElementById('chatInputUI').value;
                    if(!val || !state.isAlive) return;
                    UI.addMsg(state.name, val);
                    document.getElementById('chatInputUI').value = '';
                    
                    // Trigger bots to reply occasionally when human speaks
                    if(Math.random() > 0.3) setTimeout(() => Host.triggerBots(), 2000);
                }
            };
        })();
    </script>
</body>
</html>
