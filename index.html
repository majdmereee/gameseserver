<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوكي نيون أونلاين 🏑</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; }
        .container { background: #1e1e24; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,204,0.1); text-align: center; width: 90%; max-width: 450px; z-index: 10; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); margin-bottom: 5px; }
        .input-group { display: flex; gap: 10px; margin: 15px 0; }
        input { flex: 1; padding: 12px; border: 2px solid #555; background: #121212; color: #fff; border-radius: 8px; text-align: center; outline: none;}
        input:focus { border-color: #00ffcc; }
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; background: #00ffcc; color:#000; transition: 0.3s;}
        button:hover { box-shadow: 0 0 15px #00ffcc; }
        
        #gameArea { display: none; flex-direction: column; align-items: center; }
        #status { margin: 10px 0; font-size: 1.1em; font-weight: bold; color: #ffcc00; }
        .score-board { display: flex; justify-content: space-between; width: 100%; max-width: 400px; font-size: 1.5em; font-weight: bold; margin-bottom: 10px; }
        .score-p2 { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .score-p1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        canvas { background: #1a1a24; border: 3px solid #333; border-radius: 10px; box-shadow: inset 0 0 20px #000; max-width: 100%; }
    </style>
</head>
<body>

    <div class="container" id="loginArea">
        <h1>هوكي نيون 🏑</h1>
        <p style="color: #aaa;">العب مع صديقك بنفس رقم الغرفة</p>
        
        <div class="input-group">
            <input type="text" id="playerName" placeholder="اسمك..." required>
            <input type="number" id="roomCode" placeholder="رقم الغرفة (مثال: 55)" required>
        </div>
        <button onclick="joinRoom()" id="joinBtn">دخول الغرفة 🚀</button>
    </div>

    <div id="gameArea">
        <div class="score-board">
            <div class="score-p2" id="score2">0 (الخصم)</div>
            <div id="status">بانتظار الاتصال...</div>
            <div class="score-p1" id="score1">(أنت) 0</div>
        </div>
        <canvas id="hockeyBoard" width="400" height="600"></canvas>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const SERVER_URL = 'https://render-kr1o.onrender.com/';
        let socket;
        let myRole = 0, myName = "", roomCode = "";
        let isPlaying = false;

        const canvas = document.getElementById('hockeyBoard');
        const ctx = canvas.getContext('2d');
        
        // متغيرات للرسم سيتم تحديثها من السيرفر
        let renderState = { 
            p1: {x: 200, y: 520}, p2: {x: 200, y: 80}, puck: {x: 200, y: 300} 
        };

        function joinRoom() {
            myName = document.getElementById('playerName').value.trim();
            roomCode = document.getElementById('roomCode').value.trim();
            if (!myName || !roomCode) return alert("الرجاء كتابة اسمك ورقم الغرفة!");

            document.getElementById('joinBtn').innerText = "جاري الاتصال بالسيرفر...";
            socket = io(SERVER_URL);

            socket.on('connect', () => {
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('gameArea').style.display = 'flex';
                socket.emit('joinRoom', { playerName: myName, roomCode: roomCode });
            });

            socket.on('joined', (data) => {
                myRole = data.role;
                if (data.state === 'waiting') {
                    document.getElementById('status').innerText = "⏳ بانتظار دخول اللاعب الثاني...";
                }
            });

            socket.on('gameStart', (data) => {
                isPlaying = true;
                document.getElementById('status').innerText = "🔥 بدأت اللعبة!";
                document.getElementById('status').style.color = "#00ffcc";
                
                // تعديل الأسماء بناءً على دورك
                if(myRole === 1) {
                    document.getElementById('score1').innerText = `(أنت) 0`;
                    document.getElementById('score2').innerText = `0 (${data.p2Name})`;
                } else {
                    document.getElementById('score2').innerText = `(أنت) 0`;
                    document.getElementById('score1').innerText = `0 (${data.p1Name})`;
                }
            });

            socket.on('gameState', (data) => {
                renderState = data;
                
                // تحديث النتيجة
                let nameP1 = document.getElementById('score1').innerText.replace(/[0-9]/g, '').trim();
                let nameP2 = document.getElementById('score2').innerText.replace(/[0-9]/g, '').trim();
                
                if (myRole === 1) {
                    document.getElementById('score1').innerText = `(أنت) ${data.score.p1}`;
                    document.getElementById('score2').innerText = `${data.score.p2} (${nameP2.replace('(', '').replace(')', '')})`;
                } else {
                    document.getElementById('score2').innerText = `(أنت) ${data.score.p2}`;
                    document.getElementById('score1').innerText = `${data.score.p1} (${nameP1.replace('(', '').replace(')', '')})`;
                }
                
                draw();
            });

            socket.on('gameOver', (data) => {
                isPlaying = false;
                if (data.winnerRole === myRole) {
                    document.getElementById('status').innerText = "🎉 مبروك! لقد فزت!";
                } else {
                    document.getElementById('status').innerText = "💀 لقد خسرت!";
                    // الخاسر يرسل رسالة تصبح على خير للمنتصر
                    socket.emit('chatMessage', `تصبح على خير يا ${data.winnerName} 😴`);
                }
            });

            socket.on('chatMessage', (msg) => {
                alert(`رسالة من الخصم:\n\n${msg}`);
                document.getElementById('status').innerText = msg;
            });

            socket.on('playerLeft', () => {
                isPlaying = false;
                alert("انسحب الخصم من الغرفة!");
                document.getElementById('status').innerText = "🏃‍♂️ هرب الخصم!";
            });

            socket.on('roomFull', () => {
                alert("الغرفة ممتلئة! اختر رقماً آخر.");
                location.reload();
            });
        }

        // إرسال حركتك للسيرفر
        function sendMove(clientX, clientY) {
            if (!isPlaying || !socket) return;
            const rect = canvas.getBoundingClientRect();
            let mx = (clientX - rect.left) * (canvas.width / rect.width);
            let my = (clientY - rect.top) * (canvas.height / rect.height);

            // تحديد مجال الحركة حتى لا تتجاوز خط المنتصف
            if (myRole === 1) {
                mx = Math.max(25, Math.min(canvas.width - 25, mx));
                my = Math.max(canvas.height/2 + 25, Math.min(canvas.height - 25, my));
            } else if (myRole === 2) {
                mx = Math.max(25, Math.min(canvas.width - 25, mx));
                my = Math.max(25, Math.min(canvas.height/2 - 25, my));
            }

            socket.emit('move', { x: mx, y: my });
        }

        canvas.addEventListener('mousemove', (e) => sendMove(e.clientX, e.clientY));
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); sendMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // خط المنتصف
            ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(400, 300); ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(200, 300, 50, 0, Math.PI * 2); ctx.stroke();
            
            // المرمى
            ctx.fillStyle = 'rgba(255, 0, 85, 0.2)'; ctx.fillRect(130, 0, 140, 10);
            ctx.fillStyle = 'rgba(0, 255, 204, 0.2)'; ctx.fillRect(130, 590, 140, 10);

            // رسم العناصر من بيانات السيرفر
            if(renderState.p1) { ctx.beginPath(); ctx.arc(renderState.p1.x, renderState.p1.y, 25, 0, Math.PI * 2); ctx.fillStyle = '#00ffcc'; ctx.fill(); }
            if(renderState.p2) { ctx.beginPath(); ctx.arc(renderState.p2.x, renderState.p2.y, 25, 0, Math.PI * 2); ctx.fillStyle = '#ff0055'; ctx.fill(); }
            if(renderState.puck) { ctx.beginPath(); ctx.arc(renderState.puck.x, renderState.puck.y, 15, 0, Math.PI * 2); ctx.fillStyle = '#ffcc00'; ctx.fill(); }
        }
        draw(); // رسمة أولية
    </script>
</body>
</html>
