<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dark Tether - 50 Stages (Ultimate Stability & Voice)</title>
    
    <!-- استدعاء مكتبة Socket.IO للاتصال اللحظي -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        :root { --c-main: #3b82f6; --c-run: #ef4444; --c-bg: #020202; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--c-bg); touch-action: none; }
        
        #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; outline: none; }
        
        /* واجهة اللوبي الاحترافية */
        #lobby-ui { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #111, #000); transition: opacity 0.8s ease; }
        .lobby-box { background: rgba(10, 10, 10, 0.95); border: 1px solid #333; padding: 50px; width: 90%; max-width: 480px; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .game-title { text-align: center; color: #fff; font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; color: #888; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; }
        .lobby-input { width: 100%; padding: 15px; background: #050505; border: 1px solid #222; color: #fff; font-size: 1.2rem; text-align: center; outline: none; transition: 0.3s; }
        .lobby-input:focus { border-color: var(--c-main); box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
        
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 35px; }
        .btn { padding: 18px; font-size: 1.1rem; font-weight: bold; color: #fff; border: none; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .btn:active { transform: scale(0.98); }
        .btn-guide { background: linear-gradient(90deg, #1e3a8a, #2563eb); }
        .btn-runner { background: linear-gradient(90deg, #7f1d1d, #dc2626); }

        /* واجهة اللعب HUD */
        #hud-layer { position: absolute; inset: 0; z-index: 10; display: none; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: rgba(255,255,255,0.9); border-radius: 50%; box-shadow: 0 0 5px #000; }
        
        /* شريط علوي */
        #top-hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; font-size: 0.75rem; font-weight: bold; color: #aaa; background: rgba(0,0,0,0.5); padding: 4px 15px; border-radius: 20px; border: 1px solid #333; backdrop-filter: blur(5px); }
        #top-hud span { color: #fff; }

        /* التلميحات */
        #hint-ui { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 1px solid #ff4400; color: #ffaa00; padding: 15px 25px; font-size: 1rem; font-weight: bold; text-align: center; display: none; opacity: 0; transition: opacity 0.5s; width: 85%; max-width: 450px; line-height: 1.6; }

        /* أزرار التواصل */
        .comm-buttons { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; pointer-events: auto; }
        .comm-btn { width: 45px; height: 45px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 1.2rem; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); touch-action: none; }
        .comm-btn.active { background: rgba(255, 50, 50, 0.7) !important; transform: scale(0.9); border-color: #fff; box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        
        /* صندوق المحادثة */
        #chat-box { position: absolute; bottom: 75px; left: 20px; width: 250px; height: 150px; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 8px; display: none; flex-direction: column; pointer-events: auto; }
        #chat-msgs { flex: 1; overflow-y: auto; padding: 8px; color: #ddd; font-size: 0.8rem; line-height: 1.4; }
        #chat-input { width: 100%; border: none; border-top: 1px solid #333; background: #111; color: #fff; padding: 8px; font-size: 0.8rem; outline: none; }

        /* التحكم باللمس */
        #touch-controls { position: absolute; inset: 0; z-index: 5; display: none; touch-action: none; pointer-events: none; }
        .touch-half { position: absolute; top: 0; height: 100%; pointer-events: auto; }
        #left-half { left: 0; width: 50%; }
        #right-half { right: 0; width: 50%; }
        #joystick-bg { position: absolute; width: 100px; height: 100px; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
        #joystick-thumb { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        /* الأزرار التفاعلية */
        .right-buttons { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        .action-btn { width: 55px; height: 55px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 1.3rem; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); }
        .action-btn:active { transform: scale(0.9); }
        
        #btn-door { display: none; background: rgba(150, 80, 20, 0.6); border-color: #f90; }
        
        #btn-nvg { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(0,30,0,0.6); border: 1px solid #0f0; color: #0f0; font-size: 0.8rem; font-weight: bold; border-radius: 8px; display: none; pointer-events: auto; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        #btn-nvg.active { background: rgba(0,255,0,0.3); box-shadow: 0 0 15px #0f0; color: #fff; }

        #flash-overlay { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 99; transition: opacity 0.3s; }
    </style>
</head>
<body>

    <div id="game-canvas"></div>
    <div id="flash-overlay"></div>

    <div id="lobby-ui">
        <div class="lobby-box">
            <h1 class="game-title">TETHERED SOULS<br><span style="font-size:0.9rem; color:#888; font-weight:normal;">THE 50 STAGES OF ABYSS</span></h1>
            <div class="input-group">
                <label>معرف الهوية</label>
                <input type="text" id="inp-name" class="lobby-input" placeholder="أدخل اسمك...">
            </div>
            <div class="input-group">
                <label>تردد السيرفر (الغرفة)</label>
                <input type="number" id="inp-room" class="lobby-input" placeholder="0000">
            </div>
            <div class="btn-group">
                <button class="btn btn-guide" onclick="GameCore.boot('guide')">المهندس (الرائي)</button>
                <button class="btn btn-runner" onclick="GameCore.boot('runner')">المنفذ (المتحكم)</button>
            </div>
        </div>
    </div>

    <div id="hud-layer">
        <div class="crosshair"></div>
        <div id="top-hud">
            <div>المرحلة: <span id="level-num">1</span>/50</div>
            <div>المهام: <span id="task-count">0</span></div>
        </div>
        <div id="hint-ui">...</div>
        <div id="btn-nvg">NVG</div>

        <div class="comm-buttons">
            <div id="btn-mic" class="comm-btn" title="اضغط باستمرار للتحدث">🎙️</div>
            <div id="btn-chat" class="comm-btn">💬</div>
        </div>
        
        <div id="chat-box">
            <div id="chat-msgs"></div>
            <input type="text" id="chat-input" placeholder="رسالة...">
        </div>

        <div class="right-buttons">
            <div id="btn-door" class="action-btn">🚪</div>
            <div id="btn-jump" class="action-btn">⬆️</div>
        </div>
    </div>

    <div id="touch-controls">
        <div id="left-half" class="touch-half"></div>
        <div id="right-half" class="touch-half"></div>
        <div id="joystick-bg"><div id="joystick-thumb"></div></div>
    </div>

    <script>
        // ============================================================================
        // 1. ENGINE: PixelArt Texture Generator
        // ============================================================================
        class TextureEngine {
            static generate(size, renderFunc) {
                const c = document.createElement('canvas');
                c.width = size; c.height = size;
                renderFunc(c.getContext('2d'), size);
                const tex = new THREE.CanvasTexture(c);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                return tex;
            }

            static get StoneFloor() {
                return this.generate(16, (ctx) => {
                    ctx.fillStyle = '#0f0f0f'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#151515';
                    for(let i=0; i<16; i+=8) for(let j=0; j<16; j+=8) ctx.fillRect(i+1, j+1, 6, 6);
                });
            }
            static get BrickWall() {
                return this.generate(16, (ctx) => {
                    ctx.fillStyle = '#1c1c1c'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(0,3,16,1); ctx.fillRect(0,7,16,1); ctx.fillRect(0,11,16,1); ctx.fillRect(0,15,16,1);
                    ctx.fillRect(4,0,1,3); ctx.fillRect(12,0,1,3); ctx.fillRect(8,4,1,3);
                    ctx.fillRect(4,8,1,3); ctx.fillRect(12,8,1,3); ctx.fillRect(8,12,1,3);
                });
            }
            static get GlassNVG() {
                return this.generate(16, (ctx) => {
                    ctx.fillStyle = 'rgba(0,30,0,0.6)'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = 'rgba(0,200,0,0.8)';
                    ctx.fillRect(0,0,16,1); ctx.fillRect(0,15,16,1);
                    ctx.fillRect(0,0,1,16); ctx.fillRect(15,0,1,16);
                    ctx.fillRect(2,2,3,1); 
                });
            }
            static get RustyDoor() {
                return this.generate(16, (ctx) => {
                    ctx.fillStyle = '#3a2311'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#221105'; ctx.fillRect(1,1,14,14);
                    ctx.fillStyle = '#7a6040'; ctx.fillRect(12,7,2,2); 
                });
            }
            static get Lurker() {
                return this.generate(16, (ctx) => {
                    ctx.fillStyle = '#000'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#ff0000'; ctx.fillRect(3,4,3,2); ctx.fillRect(10,4,3,2);
                });
            }
            static get Spike() {
                return this.generate(16, (ctx) => {
                    ctx.fillStyle = '#111'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#555';
                    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(13,16); ctx.lineTo(3,16); ctx.fill();
                });
            }
            static get HintRune() {
                return this.generate(16, (ctx) => {
                    ctx.fillStyle = '#1c1c1c'; ctx.fillRect(0,0,16,16);
                    ctx.fillStyle = '#aa4400';
                    ctx.fillRect(4,4,8,1); ctx.fillRect(7,5,2,6); ctx.fillRect(4,11,8,1);
                });
            }
        }

        // ============================================================================
        // 2. ENGINE: 50-Stage Cryptic Level Architect (Guaranteed Paths)
        // ============================================================================
        const HINT_DATABASE = [
            "الظلام ليس فارغاً، إنه ينظر إليك.", "نصف متر فقط تفصلك عن النهاية.", 
            "الرائي يرى ما خفي، لكنه لا يملك القوة.", "وجه نورك نحو العيون الحمراء ليحترق الظل.",
            "الجدران تتنفس، لا تثق بها.", "إذا ابتعدت أكثر من نصف متر، سأسحبك لعالمي.",
            "الصمت هو لغة الموتى، استخدم اللاسلكي بحذر.", "الأشواك لا ترحم من لا يقفز.",
            "الباب لن يفتح إلا للمتحكم، وفقط إذا اقترب جداً.", "المتاهة تتغير، لا تنظر للخلف."
        ];

        class LevelArchitect {
            static build(levelNum) {
                const size = 11 + Math.floor(levelNum * 1.5);
                const s = (size % 2 === 0) ? size + 1 : size; 
                
                let grid = Array(s).fill().map(() => Array(s).fill(1));
                let doors = [], hints = [], spikes = [], exit = null;
                
                const carve = (x, y) => {
                    grid[y][x] = 0;
                    const dirs = [[0,-2], [0,2], [-2,0], [2,0]].sort(() => Math.random() - 0.5);
                    for(let d of dirs) {
                        const nx = x + d[0], ny = y + d[1];
                        if(nx > 0 && nx < s-1 && ny > 0 && ny < s-1 && grid[ny][nx] === 1) {
                            grid[y + d[1]/2][x + d[0]/2] = 0;
                            carve(nx, ny);
                        }
                    }
                };
                carve(1, 1);

                // ضمان فتح طريق للنهاية
                grid[s-2][s-2] = 0; grid[s-3][s-2] = 0; grid[s-2][s-3] = 0;

                const roomCount = Math.floor(levelNum / 4);
                for(let i=0; i<roomCount; i++) {
                    let rx = Math.floor(Math.random()*(s-4))+2;
                    let ry = Math.floor(Math.random()*(s-4))+2;
                    for(let dy=0; dy<3; dy++) {
                        for(let dx=0; dx<3; dx++) {
                            if (ry+dy < s-1 && rx+dx < s-1) grid[ry+dy][rx+dx] = 0;
                        }
                    }
                }

                for(let y=s-2; y>0; y--) {
                    for(let x=s-2; x>0; x--) {
                        if(grid[y][x] === 0 && !exit) {
                            grid[y][x] = 9; exit = {x, z:y};
                        }
                    }
                }

                for(let y=2; y<s-2; y++) {
                    for(let x=2; x<s-2; x++) {
                        if(grid[y][x] === 0 && Math.random() < 0.08) {
                            let type = Math.random();
                            if(type < 0.3) { grid[y][x] = 2; doors.push({x, z:y}); }
                            else if(type < 0.6 && levelNum > 2) { grid[y][x] = 3; spikes.push({x, z:y}); }
                            else if(type < 0.7) { 
                                grid[y][x] = 4; 
                                hints.push({x, z:y, text: HINT_DATABASE[Math.floor(Math.random()*HINT_DATABASE.length)]}); 
                            }
                        }
                    }
                }

                return { grid, size: s, doors, hints, spikes, exit, monsters: Math.floor(levelNum/2), start: {x:1, z:1} };
            }
        }

        // ============================================================================
        // 3. NETWORK CONTROLLER (كما ورد في الوثيقة للربط الموثوق)
        // ============================================================================
        const NetworkController = {
            socket: null,
            SERVER_URL: 'https://render-kr1o.onrender.com/',
            
            init() {
                try {
                    this.socket = io(this.SERVER_URL, { transports: ['websocket'] });
                    
                    this.socket.on('connect', () => { 
                        console.log("Connected securely to Server.");
                        // إرسال معلومات الانضمام فوراً
                        this.emit('join_room', { name: GameCore.state.name });
                    });
                    
                    // الاستماع للبيانات القادمة من السيرفر بالنمط المعتمد
                    this.socket.on('otherPlayerMoved', (data) => this.processIncoming(data));
                    
                    // أحداث الصوت والمحادثة المخصصة
                    this.socket.on('chatMsg', (data) => GameCore.commSys.handleChat(data));
                    this.socket.on('voiceData', (data) => GameCore.commSys.handleVoice(data));
                    
                } catch (e) { console.error("Network Initialization Failed:", e); }
            },
            
            emit(type, payload) { 
                if (this.socket?.connected) {
                    this.socket.emit('playerMoved', { 
                        type, 
                        room: GameCore.state.room, 
                        role: GameCore.state.role,
                        ...payload 
                    }); 
                }
            },
            
            emitRaw(eventName, payload) {
                if (this.socket?.connected) this.socket.emit(eventName, payload);
            },
            
            processIncoming(data) {
                if (data.room !== GameCore.state.room || data.role === GameCore.state.role) return; 
                
                switch (data.type) {
                    case 'sync_pos': 
                        GameCore.remotePos.set(data.x, data.y, data.z);
                        if (data.lvl > GameCore.state.level) {
                            GameCore.state.level = data.lvl;
                            GameCore.loadLevel(data.lvl);
                        }
                        break;
                    case 'door_toggle': 
                        const door = GameCore.doors.find(d => d.gx === data.gx && d.gz === data.gz);
                        if (door) {
                            door.open = data.open;
                            door.targetRot = door.open ? Math.PI / 2 : 0;
                        }
                        break;
                }
            }
        };

        // ============================================================================
        // 4. ENGINE: Audio & Chat System (Walkie-Talkie Push-to-Talk)
        // ============================================================================
        class CommunicationSystem {
            constructor(room, role) {
                this.room = room; this.role = role;
                
                this.chatBtn = document.getElementById('btn-chat');
                this.chatBox = document.getElementById('chat-box');
                this.chatInput = document.getElementById('chat-input');
                this.chatMsgs = document.getElementById('chat-msgs');
                
                let chatOpen = false;
                this.chatBtn.addEventListener('click', () => {
                    chatOpen = !chatOpen;
                    this.chatBox.style.display = chatOpen ? 'flex' : 'none';
                    if(chatOpen) this.chatInput.focus();
                });

                this.chatInput.addEventListener('keypress', (e) => {
                    if(e.key === 'Enter' && this.chatInput.value.trim() !== '') {
                        const msg = this.chatInput.value.trim();
                        this.appendMsg('أنت', msg, '#3b82f6');
                        NetworkController.emitRaw('chatMsg', { room: this.room, sender: this.role, text: msg });
                        this.chatInput.value = '';
                    }
                });

                this.micBtn = document.getElementById('btn-mic');
                this.peer = null;
                this.localStream = null;
                this.audioCtx = null; 

                const startMic = async (e) => {
                    if(e) e.preventDefault();
                    this.micBtn.classList.add('active');
                    if(this.localStream && this.localStream.getAudioTracks()[0]) {
                        this.localStream.getAudioTracks()[0].enabled = true; 
                    } else {
                        await this.initLiveCall();
                        if(this.localStream) this.localStream.getAudioTracks()[0].enabled = true;
                    }
                };

                const stopMic = (e) => {
                    if(e) e.preventDefault();
                    this.micBtn.classList.remove('active');
                    if(this.localStream && this.localStream.getAudioTracks()[0]) {
                        this.localStream.getAudioTracks()[0].enabled = false; 
                    }
                };

                this.micBtn.addEventListener('pointerdown', startMic);
                this.micBtn.addEventListener('pointerup', stopMic);
                this.micBtn.addEventListener('pointerleave', stopMic);
                
                setTimeout(() => this.initLiveCall(), 1500);
            }

            handleChat(data) {
                if(data.sender !== this.role) this.appendMsg(data.sender, data.text, '#ef4444');
            }

            async handleVoice(data) {
                if(data.role !== this.role && data.signal) {
                    if(!this.peer) this.initPeer();
                    if(data.signal.sdp) {
                        await this.peer.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                        if(data.signal.sdp.type === 'offer') {
                            const ans = await this.peer.createAnswer();
                            await this.peer.setLocalDescription(ans);
                            NetworkController.emitRaw('voiceData', { room: this.room, role: this.role, signal: { sdp: this.peer.localDescription } });
                        }
                    } else if(data.signal.ice) {
                        await this.peer.addIceCandidate(new RTCIceCandidate(data.signal.ice));
                    }
                }
            }

            async initLiveCall() {
                if(this.localStream) return;
                try {
                    this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.localStream.getAudioTracks()[0].enabled = false; 
                    
                    if(!this.peer) this.initPeer();
                    this.localStream.getTracks().forEach(t => this.peer.addTrack(t, this.localStream));
                    const offer = await this.peer.createOffer();
                    await this.peer.setLocalDescription(offer);
                    NetworkController.emitRaw('voiceData', { room: this.room, role: this.role, signal: { sdp: this.peer.localDescription } });
                } catch(e) { console.warn("Mic Error", e); }
            }

            initPeer() {
                this.peer = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                this.peer.onicecandidate = e => {
                    if(e.candidate) NetworkController.emitRaw('voiceData', { room: this.room, role: this.role, signal: { ice: e.candidate } });
                };
                
                this.peer.ontrack = e => {
                    let audio = document.getElementById('live-audio');
                    if(!audio) {
                        audio = document.createElement('audio');
                        audio.id = 'live-audio';
                        audio.autoplay = true;
                        audio.muted = true; 
                        document.body.appendChild(audio);
                    }
                    audio.srcObject = e.streams[0];
                    this.applyRadioEffect(audio, e.streams[0]);
                };
            }

            applyRadioEffect(audioElement, stream) {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                }
                const source = this.audioCtx.createMediaStreamSource(stream);
                const bandpass = this.audioCtx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.value = 1200; 
                bandpass.Q.value = 0.8; 
                const distortion = this.audioCtx.createWaveShaper();
                distortion.curve = this.makeDistortionCurve(15);
                distortion.oversample = '4x';

                source.connect(bandpass);
                bandpass.connect(distortion);
                distortion.connect(this.audioCtx.destination);
                this.audioCtx.resume();
            }

            makeDistortionCurve(amount) {
                let k = typeof amount === 'number' ? amount : 50,
                    n_samples = 44100,
                    curve = new Float32Array(n_samples),
                    deg = Math.PI / 180, i = 0, x;
                for ( ; i < n_samples; ++i ) {
                    x = i * 2 / n_samples - 1;
                    curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
                }
                return curve;
            }

            appendMsg(sender, text, color) {
                this.chatMsgs.innerHTML += `<div style="margin-bottom:5px;"><span style="color:${color}; font-weight:bold;">[${sender}]:</span> ${text}</div>`;
                this.chatMsgs.scrollTop = this.chatMsgs.scrollHeight;
            }
        }

        // ============================================================================
        // 5. ENGINE: Core Game Physics & Logic
        // ============================================================================
        const GameCore = {
            state: { role: '', room: '', name: '', level: 1, tetherMax: 1.0 }, 
            input: { mx: 0, my: 0, isJumping: false },
            
            boot(role) {
                this.state.name = document.getElementById('inp-name').value.trim();
                this.state.room = document.getElementById('inp-room').value.trim();
                if(!this.state.name || !this.state.room) return;
                
                this.state.role = role;
                document.getElementById('lobby-ui').style.opacity = '0';
                
                // بدء تشغيل الشبكة أولاً
                NetworkController.init();

                setTimeout(() => {
                    document.getElementById('lobby-ui').style.display = 'none';
                    document.getElementById('hud-layer').style.display = 'block';
                    document.getElementById('touch-controls').style.display = 'block';
                    this.initEngine();
                }, 800);
            },

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x010101);

                this.camera = new THREE.PerspectiveCamera(85, window.innerWidth/window.innerHeight, 0.1, 100);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(1);
                document.getElementById('game-canvas').appendChild(this.renderer.domElement);

                this.mats = {
                    floor: new THREE.MeshPhongMaterial({ map: TextureEngine.StoneFloor }),
                    wall: new THREE.MeshPhongMaterial({ map: TextureEngine.BrickWall }),
                    nvgWall: new THREE.MeshBasicMaterial({ map: TextureEngine.GlassNVG, transparent: true, opacity: 0.7, side: THREE.DoubleSide }),
                    door: new THREE.MeshPhongMaterial({ map: TextureEngine.RustyDoor }),
                    hint: new THREE.MeshPhongMaterial({ map: TextureEngine.HintRune }),
                    spike: new THREE.MeshPhongMaterial({ map: TextureEngine.Spike }),
                    exit: new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true })
                };

                this.worldGroup = new THREE.Group();
                this.scene.add(this.worldGroup);

                this.guidePos = new THREE.Vector3();
                this.runnerPos = new THREE.Vector3();
                this.localPos = this.state.role === 'guide' ? this.guidePos : this.runnerPos;
                this.remotePos = this.state.role === 'guide' ? this.runnerPos : this.guidePos;
                this.velY = 0; this.isGrounded = true;

                this.setupRoleLogic();
                this.setupInputs();
                
                this.commSys = new CommunicationSystem(this.state.room, this.state.role);

                this.loadLevel(this.state.level);

                this.clock = new THREE.Clock();
                this.renderer.setAnimationLoop(() => this.tick());
            },

            loadLevel(num) {
                document.getElementById('level-num').innerText = num;
                while(this.worldGroup.children.length > 0) this.worldGroup.remove(this.worldGroup.children[0]);
                
                this.lvl = LevelArchitect.build(num);
                this.blockSize = 2; 
                const b = this.blockSize;
                
                this.doors = []; this.spikes = []; this.hints = []; this.monsters = [];
                
                const boxGeo = new THREE.BoxGeometry(b, b*2, b);
                const planeGeo = new THREE.PlaneGeometry(b, b);
                
                for(let z=0; z<this.lvl.size; z++) {
                    for(let x=0; x<this.lvl.size; x++) {
                        const px = x*b, pz = z*b;
                        
                        const f = new THREE.Mesh(planeGeo, this.mats.floor);
                        f.rotation.x = -Math.PI/2; f.position.set(px, 0, pz);
                        this.worldGroup.add(f);

                        let type = this.lvl.grid[z][x];
                        if(type === 1) {
                            const w = new THREE.Mesh(boxGeo, this.mats.wall);
                            w.position.set(px, b, pz);
                            this.worldGroup.add(w);
                        } else if(type === 2) {
                            const dGrp = new THREE.Group(); dGrp.position.set(px-b/2, 0, pz);
                            const d = new THREE.Mesh(new THREE.BoxGeometry(b, b*2, b*0.2), this.mats.door);
                            d.position.set(b/2, b, 0); dGrp.add(d);
                            this.worldGroup.add(dGrp);
                            this.doors.push({ x:px, z:pz, gx:x, gz:z, grp: dGrp, open: false, rot:0 });
                        } else if(type === 3) {
                            const s = new THREE.Mesh(new THREE.ConeGeometry(b/2.5, b, 4), this.mats.spike);
                            s.position.set(px, -b, pz);
                            this.worldGroup.add(s);
                            this.spikes.push({ mesh: s, active: false, timer: Math.random()*3 });
                        } else if(type === 4) {
                            const h = new THREE.Mesh(boxGeo, this.mats.hint);
                            h.position.set(px, b, pz);
                            this.worldGroup.add(h);
                            this.hints.push({ pos: new THREE.Vector3(px,b,pz), text: this.lvl.hints.find(hi=>hi.x===x && hi.z===z).text });
                        } else if(type === 9) {
                            this.exitMesh = new THREE.Mesh(boxGeo, this.mats.exit);
                            this.exitMesh.position.set(px, b, pz);
                            this.worldGroup.add(this.exitMesh);
                        }
                    }
                }

                for(let i=0; i<this.lvl.monsters; i++) {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.5, 1.5), new THREE.MeshPhongMaterial({map: TextureEngine.Lurker}));
                    let mx = Math.floor(Math.random()*this.lvl.size); let mz = Math.floor(Math.random()*this.lvl.size);
                    if(this.lvl.grid[mz][mx]===0) {
                        m.position.set(mx*b, 1.25, mz*b);
                        this.worldGroup.add(m);
                        this.monsters.push({ mesh: m, hp: 100, dir: new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).normalize() });
                    }
                }

                const st = new THREE.Vector3(this.lvl.start.x*b, 2.0, this.lvl.start.z*b);
                this.guidePos.copy(st).add(new THREE.Vector3(-0.5,0,0));
                this.runnerPos.copy(st).add(new THREE.Vector3(0.5,0,0));
                this.camera.position.copy(this.localPos);
            },

            setupRoleLogic() {
                this.ambient = new THREE.AmbientLight(0xffffff, 0.03);
                this.scene.add(this.ambient);

                if (this.state.role === 'guide') {
                    this.nvgBtn = document.getElementById('btn-nvg');
                    this.nvgBtn.style.display = 'flex';
                    this.nvgState = false;
                    
                    this.nvgBtn.addEventListener('click', () => {
                        this.nvgState = !this.nvgState;
                        this.nvgBtn.classList.toggle('active');
                        
                        this.worldGroup.children.forEach(c => {
                            if(c.geometry.type === 'BoxGeometry' && (c.material === this.mats.wall || c.material === this.mats.nvgWall)) {
                                c.material = this.nvgState ? this.mats.nvgWall : this.mats.wall;
                            }
                        });

                        if(this.nvgState) {
                            this.scene.background.setHex(0x001100);
                            this.ambient.color.setHex(0x00ff00);
                            this.ambient.intensity = 0.6;
                            this.scene.fog = new THREE.Fog(0x001100, 1, 6); 
                        } else {
                            this.scene.background.setHex(0x010101);
                            this.ambient.color.setHex(0xffffff);
                            this.ambient.intensity = 0.03;
                            this.scene.fog = null;
                        }
                    });

                } else {
                    this.scene.fog = new THREE.FogExp2(0x010101, 0.12);
                    
                    this.flash = new THREE.SpotLight(0xfff5e6, 5.0, 30.0, Math.PI / 5, 0.8, 1.2);
                    this.flash.position.set(0.6, -0.4, 0); 
                    this.camera.add(this.flash);
                    
                    this.flash.target.position.set(0.6, -0.4, -5);
                    this.camera.add(this.flash.target);

                    this.bounceLight = new THREE.PointLight(0xffffff, 0.3, 5.0);
                    this.camera.add(this.bounceLight);
                    
                    this.scene.add(this.camera); 
                    
                    this.doorBtn = document.getElementById('btn-door');
                    this.doorBtn.addEventListener('click', () => {
                        if(this.nearDoor) {
                            this.nearDoor.open = !this.nearDoor.open;
                            this.nearDoor.targetRot = this.nearDoor.open ? Math.PI/2 : 0;
                            // مزامنة حركة الباب عبر NetworkController
                            NetworkController.emit('door_toggle', { 
                                gx: this.nearDoor.gx, 
                                gz: this.nearDoor.gz, 
                                open: this.nearDoor.open 
                            });
                        }
                    });
                }
            },

            setupInputs() {
                const zL = document.getElementById('left-half');
                const zR = document.getElementById('right-half');
                const jBg = document.getElementById('joystick-bg');
                const jTh = document.getElementById('joystick-thumb');

                let mId = null, lId = null, mOrg = {x:0, y:0}, lLast = {x:0, y:0};

                zL.addEventListener('pointerdown', e => {
                    mId = e.pointerId; zL.setPointerCapture(mId); mOrg = {x: e.clientX, y: e.clientY};
                    jBg.style.opacity = '1'; jBg.style.left = e.clientX + 'px'; jBg.style.top = e.clientY + 'px';
                    jTh.style.transform = `translate(-50%, -50%)`;
                });
                zL.addEventListener('pointermove', e => {
                    if(e.pointerId === mId) {
                        let dx = e.clientX - mOrg.x, dy = e.clientY - mOrg.y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist > 35) { dx=(dx/dist)*35; dy=(dy/dist)*35; }
                        jTh.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        this.input.mx = Math.abs(dx/35)>0.2 ? dx/35 : 0;
                        this.input.my = Math.abs(dy/35)>0.2 ? dy/35 : 0;
                    }
                });
                const stopM = e => { if(e.pointerId===mId){ mId=null; jBg.style.opacity='0'; this.input.mx=this.input.my=0; }};
                zL.addEventListener('pointerup', stopM); zL.addEventListener('pointercancel', stopM);

                zR.addEventListener('pointerdown', e => { lId = e.pointerId; zR.setPointerCapture(lId); lLast = {x: e.clientX, y: e.clientY}; });
                zR.addEventListener('pointermove', e => {
                    if(e.pointerId === lId) {
                        let dx = e.clientX - lLast.x, dy = e.clientY - lLast.y;
                        lLast = {x: e.clientX, y: e.clientY};
                        this.camera.rotation.y -= dx * 0.005;
                        this.camera.rotation.x -= dy * 0.005;
                        this.camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, this.camera.rotation.x));
                        this.camera.rotation.order = "YXZ"; 
                    }
                });
                const stopL = e => { if(e.pointerId===lId) lId=null; };
                zR.addEventListener('pointerup', stopL); zR.addEventListener('pointercancel', stopL);

                document.getElementById('btn-jump').addEventListener('pointerdown', () => {
                    if(this.isGrounded) { this.velY = 7.0; this.isGrounded = false; }
                });
            },

            checkCol(x, z) {
                const b = this.blockSize;
                const gx = Math.round(x/b), gz = Math.round(z/b);
                if(gx<0 || gx>=this.lvl.size || gz<0 || gz>=this.lvl.size) return true;
                
                const t = this.lvl.grid[gz][gx];
                if(t===1 || t===4) return true;
                if(t===2) {
                    const door = this.doors.find(d=>d.gx===gx && d.gz===gz);
                    if(door && !door.open) return true;
                }
                return false;
            },

            tick() {
                const dt = Math.min(this.clock.getDelta(), 0.05);
                
                const spd = 4.0 * dt;
                const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion);
                const rgt = new THREE.Vector3(1,0,0).applyQuaternion(this.camera.quaternion);
                fwd.y=0; rgt.y=0; fwd.normalize(); rgt.normalize();

                let mDir = new THREE.Vector3();
                mDir.addScaledVector(fwd, -this.input.my);
                mDir.addScaledVector(rgt, this.input.mx);
                mDir.normalize().multiplyScalar(spd);

                let nx = this.localPos.x + mDir.x;
                let nz = this.localPos.z + mDir.z;

                // استقرار الاصطدام
                if(this.checkCol(nx, this.localPos.z)) nx = this.localPos.x;
                if(this.checkCol(this.localPos.x, nz)) nz = this.localPos.z;

                this.velY -= 15 * dt; 
                let ny = this.localPos.y + (this.velY * dt);

                if(ny <= 2.0) { ny = 2.0; this.velY = 0; this.isGrounded = true; }
                this.localPos.set(nx, ny, nz);

                // فيزياء الجنزير المستقرة (Tether Physics)
                const dist = this.localPos.distanceTo(this.remotePos);
                
                if (this.state.role === 'guide') {
                    if (dist > this.state.tetherMax) {
                        const pullDir = this.remotePos.clone().sub(this.localPos).normalize();
                        const correction = dist - this.state.tetherMax;
                        
                        let px = this.localPos.x + (pullDir.x * correction);
                        let pz = this.localPos.z + (pullDir.z * correction);
                        
                        // منع الاختراق أثناء السحب
                        if(this.checkCol(px, this.localPos.z)) px = this.localPos.x;
                        if(this.checkCol(this.localPos.x, pz)) pz = this.localPos.z;
                        
                        this.localPos.set(px, this.localPos.y, pz);
                    }
                }

                this.camera.position.copy(this.localPos);

                this.updateWorld(dt);
                this.checkInteractions();
                
                // إرسال البيانات عبر NetworkController المحدث
                NetworkController.emit('sync_pos', {
                    lvl: this.state.level,
                    x: this.localPos.x, 
                    y: this.localPos.y, 
                    z: this.localPos.z
                });

                this.renderer.render(this.scene, this.camera);
            },

            updateWorld(dt) {
                this.nearDoor = null;
                for(let d of this.doors) {
                    d.grp.rotation.y += (d.targetRot || 0 - d.grp.rotation.y) * 10 * dt;
                    if(this.state.role === 'runner') {
                        if(this.localPos.distanceTo(new THREE.Vector3(d.x, 2, d.z)) < 2.0) {
                            this.nearDoor = d;
                        }
                    }
                }
                if(this.state.role === 'runner') this.doorBtn.style.display = this.nearDoor ? 'flex' : 'none';

                for(let s of this.spikes) {
                    s.timer -= dt;
                    if(s.timer <= 0) { s.active = !s.active; s.timer = 1.5 + Math.random(); }
                    s.mesh.position.y += ((s.active ? 0 : -this.blockSize) - s.mesh.position.y) * 10 * dt;
                    
                    if(s.active && this.isGrounded && Math.abs(this.localPos.x-s.mesh.position.x)<1 && Math.abs(this.localPos.z-s.mesh.position.z)<1) {
                        this.velY = 4; this.isGrounded = false; 
                        document.getElementById('flash-overlay').style.background = '#f00';
                        document.getElementById('flash-overlay').style.opacity = '0.4';
                        setTimeout(() => document.getElementById('flash-overlay').style.opacity='0', 200);
                    }
                }

                let fDir = (this.state.role === 'runner' && this.flash) ? new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion) : null;
                for(let i = this.monsters.length-1; i>=0; i--) {
                    let m = this.monsters[i];
                    if(fDir) {
                        const toM = m.mesh.position.clone().sub(this.localPos);
                        if(toM.length() < 12.0 && fDir.dot(toM.normalize()) > 0.85) {
                            m.hp -= 60 * dt;
                            m.mesh.material.color.setHex(0xffaaaa);
                            if(m.hp <= 0) {
                                this.worldGroup.remove(m.mesh); this.monsters.splice(i,1);
                                document.getElementById('flash-overlay').style.background = '#fff';
                                document.getElementById('flash-overlay').style.opacity = '0.8';
                                setTimeout(() => document.getElementById('flash-overlay').style.opacity='0', 150);
                                continue;
                            }
                        } else m.mesh.material.color.setHex(0xffffff);
                    }
                    
                    let nP = m.mesh.position.clone().add(m.dir.clone().multiplyScalar(1.5*dt));
                    if(this.checkCol(nP.x, nP.z)) m.dir.set(Math.random()-0.5,0,Math.random()-0.5).normalize();
                    else m.mesh.position.copy(nP);
                }
            },

            checkInteractions() {
                let hTxt = null;
                for(let h of this.hints) if(this.localPos.distanceTo(h.pos) < 3.0) hTxt = h.text;
                const hUi = document.getElementById('hint-ui');
                if(hTxt) { hUi.innerText = hTxt; hUi.style.display = 'block'; hUi.style.opacity = '1'; }
                else { hUi.style.opacity = '0'; setTimeout(()=>{ if(hUi.style.opacity==='0') hUi.style.display='none'; }, 500); }

                if(this.exitMesh && this.localPos.distanceTo(this.exitMesh.position) < 2.5) {
                    this.state.level++; this.loadLevel(this.state.level);
                }
            }
        };
    </script>
