<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Breakers - Minecraft Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #111;
            --bg-panel: rgba(15, 23, 42, 0.9);
            --color-text: #fff;
            --color-primary: #3b82f6;
            --color-success: #10b981;
            --color-danger: #f43f5e;
            --color-warning: #f59e0b;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-base);
            color: var(--color-text);
            width: 100vw; height: 100vh;
            overflow: hidden; touch-action: none;
        }

        #app-core { width: 100%; height: 100%; position: relative; }

        .overlay-screen {
            position: absolute; inset: 0; z-index: 100;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; transition: opacity 0.4s ease;
        }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }

        .panel {
            background: var(--bg-panel); border: 2px solid #333;
            padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 400px;
            display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .brand-title { text-align: center; font-size: 2.2rem; font-weight: 900; color: var(--color-success); text-shadow: 2px 2px 0 #000; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: 700; color: #ccc; }
        .input-group input {
            padding: 15px; border-radius: 8px; background: #000; border: 2px solid #444; 
            color: #fff; font-family: inherit; font-size: 1.1rem; text-align: center;
        }
        .input-group input:focus { border-color: var(--color-success); outline: none; }

        .action-area { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        
        .btn {
            padding: 15px; border: none; border-radius: 8px; font-family: inherit; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; color: #fff; display: flex; justify-content: center; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--color-primary); }
        .btn-warning { background: var(--color-warning); color: #000; }
        .btn-success { background: var(--color-success); }
        .btn-danger { background: var(--color-danger); }

        #game-canvas { position: absolute; inset: 0; z-index: 1; image-rendering: pixelated; }
        
        #hud-layer { position: absolute; top: 0; left: 0; right: 0; z-index: 10; pointer-events: none; display: flex; justify-content: space-between; padding: 15px; }
        .hud-panel { pointer-events: auto; background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border-radius: 8px; border: 2px solid #333; }
        
        #draw-overlay { position: absolute; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; padding: 20px; align-items: center; justify-content: center; }
        #drawing-board { background: #fff; border-radius: 4px; box-shadow: 0 0 0 4px #444; width: 100%; height: 50vh; max-height: 400px; touch-action: none; margin: 20px 0; }
        .draw-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }

        /* Joysticks مخصصة للواجهة الطولية */
        .joysticks-wrapper { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        .joystick-zone { 
            position: absolute; bottom: 40px; width: 120px; height: 120px; 
            border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); 
            pointer-events: auto; touch-action: none; display: flex; justify-content: center; align-items: center; 
        }
        #joystick-left { left: 20px; } 
        #joystick-right { right: 20px; }
        .joystick-knob { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.6); position: absolute; pointer-events: none; }

        /* Crosshair */
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; pointer-events: none; z-index: 10;
        }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        .crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        .crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
    </style>
</head>
<body>

    <div id="app-core">
        <canvas id="game-canvas"></canvas>
        <div class="crosshair" id="crosshair" style="display: none;"></div>
        
        <div id="joysticks-container" class="joysticks-wrapper hidden">
            <div id="joystick-left" class="joystick-zone"><div class="joystick-knob" id="knob-left"></div></div>
            <div id="joystick-right" class="joystick-zone"><div class="joystick-knob" id="knob-right"></div></div>
        </div>

        <div id="hud-layer" class="hidden">
            <div class="hud-panel">
                <h3 id="role-text" style="color: var(--color-success); font-size: 1.1rem; margin-bottom: 4px;">جاري التحميل...</h3>
                <p id="task-text" style="font-size: 0.85rem; color: #aaa;">يرجى الانتظار</p>
            </div>
            <div>
                <button id="btn-open-paper" class="btn btn-warning" style="pointer-events: auto; display: none; padding: 10px; font-size: 0.9rem;" onclick="DrawingEngine.open()">
                    <i class="fa-solid fa-pen"></i> الرسم
                </button>
            </div>
        </div>

        <div id="draw-overlay" class="hidden">
            <div style="background: #222; padding: 15px; border-radius: 8px; border: 2px solid #444; text-align: center; width: 100%;">
                <h4 style="color: var(--color-success); margin-bottom: 5px;">تلميح النظام</h4>
                <p id="system-hint-text" style="font-weight: 700; font-size: 1rem;">جاري التوليد...</p>
            </div>
            <canvas id="drawing-board"></canvas>
            <div class="draw-controls">
                <button class="btn btn-danger" onclick="DrawingEngine.clear()"><i class="fa-solid fa-eraser"></i> مسح</button>
                <button class="btn btn-success" onclick="DrawingEngine.sendTo3DWorld()"><i class="fa-solid fa-paper-plane"></i> إرسال</button>
                <button class="btn" style="background: #444; grid-column: span 2;" onclick="DrawingEngine.close()"><i class="fa-solid fa-xmark"></i> إغلاق</button>
            </div>
        </div>

        <div id="setup-screen" class="overlay-screen">
            <div class="panel">
                <h1 class="brand-title">MINECRAFT<br><span style="color: #fff; font-size: 1.5rem;">Breakers</span></h1>
                <div class="input-group">
                    <label>اسم اللاعب</label>
                    <input type="text" id="playerName" placeholder="أدخل اسمك...">
                </div>
                <div class="input-group">
                    <label>رقم الغرفة</label>
                    <input type="number" id="roomCode" placeholder="مثال: 777">
                </div>
                <div class="action-area">
                    <button class="btn btn-success" onclick="GameManager.bootstrap('drawer')">الرسّام <i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-warning" onclick="GameManager.bootstrap('solver')">المهندس <i class="fa-solid fa-wrench"></i></button>
                </div>
            </div>
        </div>

        <div id="loading-screen" class="overlay-screen hidden">
            <i class="fa-solid fa-cube fa-spin" style="font-size: 4rem; color: var(--color-success); margin-bottom: 15px;"></i>
            <h2 id="loading-text" style="font-weight: 900; text-shadow: 2px 2px 0 #000;">جاري بناء العالم...</h2>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const State = { player: { name: '', room: '', role: '' }, game: { solution: [false, false, false, false], current: [false, false, false, false] } };

        const PuzzleSystem = {
            generate() {
                let newSolution = Array.from({length: 4}, () => Math.random() > 0.5);
                if (!newSolution.includes(true)) newSolution[Math.floor(Math.random() * 4)] = true;
                State.game.solution = newSolution;
                let active = [];
                newSolution.forEach((val, i) => { if(val) active.push(i + 1); });
                document.getElementById('system-hint-text').innerText = `شغل القواطع: (${active.join(' و ')}). ارسم لغز للمهندس!`;
                NetworkController.emit('sync_puzzle', { solution: newSolution });
                setTimeout(() => GameManager.startGameplay(), 600);
            }
        };

        const NetworkController = {
            socket: null,
            SERVER_URL: 'https://render-kr1o.onrender.com/',
            init() {
                try {
                    this.socket = io(this.SERVER_URL, { transports: ['websocket'] });
                    this.socket.on('connect', () => { State.player.role === 'drawer' ? PuzzleSystem.generate() : GameManager.startGameplay(); });
                    this.socket.on('otherPlayerMoved', (data) => this.processIncoming(data));
                } catch (e) { console.error(e); }
            },
            emit(type, payload) { if (this.socket?.connected) this.socket.emit('playerMoved', { type, room: State.player.room, ...payload }); },
            processIncoming(data) {
                if (data.room !== State.player.room) return;
                switch (data.type) {
                    case 'sync_puzzle': State.game.solution = data.solution; Graphics3D.resetBreakers(); break;
                    case 'receive_drawing': Graphics3D.applyTextureToBoard(data.image); break;
                    case 'breaker_toggle':
                        if (State.player.role === 'drawer') return;
                        State.game.current[data.index] = data.state;
                        Graphics3D.animateBreaker(data.index, data.state);
                        break;
                    case 'win_game': GameManager.triggerWin(); break;
                }
            }
        };

        const DrawingEngine = {
            canvas: null, ctx: null, isDrawing: false, lastX: 0, lastY: 0,
            init() {
                this.canvas = document.getElementById('drawing-board');
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                this.resizeCanvas();
                const getPos = (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const evt = e.touches ? e.touches[0] : e;
                    return { x: (evt.clientX - rect.left) * (this.canvas.width / rect.width), y: (evt.clientY - rect.top) * (this.canvas.height / rect.height) };
                };
                const start = (e) => { e.preventDefault(); this.isDrawing = true; const pos = getPos(e); [this.lastX, this.lastY] = [pos.x, pos.y]; };
                const move = (e) => {
                    if(!this.isDrawing) return; e.preventDefault();
                    const pos = getPos(e); this.ctx.beginPath(); this.ctx.moveTo(this.lastX, this.lastY); this.ctx.lineTo(pos.x, pos.y); this.ctx.stroke();
                    [this.lastX, this.lastY] = [pos.x, pos.y];
                };
                const stop = () => this.isDrawing = false;
                this.canvas.addEventListener('pointerdown', start); this.canvas.addEventListener('pointermove', move);
                window.addEventListener('pointerup', stop); window.addEventListener('pointercancel', stop);
            },
            resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width; this.canvas.height = rect.height;
                this.clear();
            },
            clear() { this.ctx.fillStyle = '#ffffff'; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height); this.ctx.lineWidth = 4; this.ctx.lineCap = 'square'; this.ctx.strokeStyle = '#000'; },
            sendTo3DWorld() {
                const dataURL = this.canvas.toDataURL('image/png');
                Graphics3D.applyTextureToBoard(dataURL);
                NetworkController.emit('receive_drawing', { image: dataURL });
                this.close();
            },
            close() { document.getElementById('draw-overlay').classList.add('hidden'); },
            open() { document.getElementById('draw-overlay').classList.remove('hidden'); this.resizeCanvas(); }
        };

        const Graphics3D = {
            scene: null, camera: null, renderer: null, breakers: [], whiteboardMat: null,
            raycaster: new THREE.Raycaster(), centerVec: new THREE.Vector2(0,0),
            move: { x: 0, y: 0 }, look: { x: 0, y: 0 }, yaw: 0, pitch: 0, clock: new THREE.Clock(),
            
            // Texture Generator for Voxel Art
            createPixelTexture(type) {
                const canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 16;
                const ctx = canvas.getContext('2d');
                for(let i=0; i<16; i++) {
                    for(let j=0; j<16; j++) {
                        if(type === 'stone') {
                            const c = 100 + Math.random() * 50;
                            ctx.fillStyle = `rgb(${c},${c},${c})`;
                        } else if(type === 'wood') {
                            const c = 139 + Math.random() * 20;
                            ctx.fillStyle = (i%4===0) ? '#5c3a21' : `rgb(${c},${c-50},30)`;
                        } else if(type === 'obsidian') {
                            const c = 20 + Math.random() * 30;
                            ctx.fillStyle = `rgb(${c},${c/2},${c+20})`;
                        }
                        ctx.fillRect(i, j, 1, 1);
                    }
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
                return tex;
            },

            init() {
                const canvas = document.getElementById('game-canvas');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87CEEB); // لون سماء كلاسيكي
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 1.6, 2);
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                
                const light = new THREE.AmbientLight(0xffffff, 0.8);
                this.scene.add(light);
                const pLight = new THREE.PointLight(0xffaa00, 1, 10);
                pLight.position.set(0, 3, 0);
                this.scene.add(pLight);

                this.buildVoxelRoom();
                this.setupControls();
                
                if (State.player.role === 'solver') {
                    document.getElementById('crosshair').style.display = 'block';
                    // التفاعل بضغطة مزدوجة في منتصف الشاشة (Crosshair)
                    canvas.addEventListener('pointerdown', () => this.interact());
                }

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
                
                this.gameLoop();
            },

            buildVoxelRoom() {
                const stoneMat = new THREE.MeshLambertMaterial({ map: this.createPixelTexture('stone') });
                const woodMat = new THREE.MeshLambertMaterial({ map: this.createPixelTexture('wood') });
                const obsMat = new THREE.MeshLambertMaterial({ map: this.createPixelTexture('obsidian') });
                const geo = new THREE.BoxGeometry(1, 1, 1);

                // بناء الغرفة (10x10x5)
                for(let x=-5; x<=5; x++) {
                    for(let z=-5; z<=5; z++) {
                        let floor = new THREE.Mesh(geo, woodMat); floor.position.set(x, 0, z); this.scene.add(floor);
                        let ceil = new THREE.Mesh(geo, stoneMat); ceil.position.set(x, 5, z); this.scene.add(ceil);
                        if(Math.abs(x)===5 || Math.abs(z)===5) {
                            for(let y=1; y<=4; y++) {
                                let wall = new THREE.Mesh(geo, obsMat); wall.position.set(x, y, z); this.scene.add(wall);
                            }
                        }
                    }
                }

                // Whiteboard (لوحة الرسم) على الجدار الشمالي
                const boardGeo = new THREE.PlaneGeometry(4, 3);
                this.whiteboardMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const board = new THREE.Mesh(boardGeo, this.whiteboardMat);
                board.position.set(0, 2.5, -4.49);
                this.scene.add(board);

                // لوحة القواطع على الجدار الجنوبي
                for(let i=0; i<4; i++) {
                    const group = new THREE.Group();
                    group.position.set(-1.5 + (i * 1), 2, 4.49);
                    group.rotation.y = Math.PI;
                    
                    const base = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.2), new THREE.MeshLambertMaterial({color: 0x333333}));
                    group.add(base);

                    const lever = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), new THREE.MeshLambertMaterial({color: 0xff0000}));
                    lever.position.z = 0.1; lever.rotation.x = -Math.PI/4;
                    lever.userData = { index: i, state: false };
                    
                    group.add(lever);
                    this.breakers.push(lever);
                    this.scene.add(group);
                }
            },

            applyTextureToBoard(base64) {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const tex = new THREE.CanvasTexture(canvas);
                    tex.magFilter = THREE.NearestFilter;
                    this.whiteboardMat.map = tex;
                    this.whiteboardMat.needsUpdate = true;
                };
                img.src = base64;
            },

            interact() {
                this.raycaster.setFromCamera(this.centerVec, this.camera); // من منتصف الشاشة (Crosshair)
                const intersects = this.raycaster.intersectObjects(this.breakers);
                if (intersects.length > 0 && intersects[0].distance < 3) {
                    const lever = intersects[0].object;
                    const newState = !lever.userData.state;
                    lever.userData.state = newState;
                    State.game.current[lever.userData.index] = newState;
                    this.animateBreaker(lever.userData.index, newState);
                    NetworkController.emit('breaker_toggle', { index: lever.userData.index, state: newState });
                    this.verifyWin();
                }
            },

            animateBreaker(idx, state) {
                const lever = this.breakers[idx];
                lever.rotation.x = state ? Math.PI/4 : -Math.PI/4;
                lever.material.color.setHex(state ? 0x00ff00 : 0xff0000);
            },

            resetBreakers() { this.breakers.forEach((b, i) => { b.userData.state = false; this.animateBreaker(i, false); }); },

            verifyWin() { 
                if(State.game.current.every((v, i) => v === State.game.solution[i])) {
                    NetworkController.emit('win_game', {}); GameManager.triggerWin();
                }
            },

            setupControls() {
                document.getElementById('joysticks-container').classList.remove('hidden');
                const attach = (id, outVec) => {
                    const zone = document.getElementById(id); const knob = zone.firstChild;
                    let active = false;
                    const move = (e) => {
                        if(!active) return;
                        const rect = zone.getBoundingClientRect();
                        let dx = e.clientX - (rect.left + rect.width/2);
                        let dy = e.clientY - (rect.top + rect.height/2);
                        const maxR = rect.width/2 - 10;
                        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), maxR);
                        const angle = Math.atan2(dy, dx);
                        dx = Math.cos(angle)*dist; dy = Math.sin(angle)*dist;
                        knob.style.transform = `translate(${dx}px, ${dy}px)`;
                        outVec.x = dx / maxR; outVec.y = dy / maxR;
                    };
                    zone.addEventListener('pointerdown', (e) => { active = true; zone.setPointerCapture(e.pointerId); move(e); });
                    zone.addEventListener('pointermove', move);
                    const stop = () => { active = false; knob.style.transform = 'translate(0,0)'; outVec.x = 0; outVec.y = 0; };
                    zone.addEventListener('pointerup', stop); zone.addEventListener('pointercancel', stop);
                };
                attach('joystick-left', this.move); attach('joystick-right', this.look);
            },

            gameLoop() {
                requestAnimationFrame(() => this.gameLoop());
                const delta = this.clock.getDelta();
                
                this.yaw -= this.look.x * 2.5 * delta;
                this.pitch -= this.look.y * 2.5 * delta;
                this.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, this.pitch));
                
                this.camera.rotation.order = 'YXZ';
                this.camera.rotation.y = this.yaw;
                this.camera.rotation.x = this.pitch;

                const dir = new THREE.Vector3(); this.camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
                
                const speed = 4;
                this.camera.position.addScaledVector(dir, -this.move.y * speed * delta);
                this.camera.position.addScaledVector(right, this.move.x * speed * delta);
                
                // اصطدام ماينكرافت (منع الخروج من الجدران)
                const bounds = 3.8;
                this.camera.position.x = Math.max(-bounds, Math.min(bounds, this.camera.position.x));
                this.camera.position.z = Math.max(-bounds, Math.min(bounds, this.camera.position.z));
                this.camera.position.y = 1.6; // ارتفاع ثابت للعين
                
                this.renderer.render(this.scene, this.camera);
            }
        };

        const GameManager = {
            bootstrap(role) {
                const name = document.getElementById('playerName').value.trim();
                const room = document.getElementById('roomCode').value.trim();
                if (!name || !room) return alert("أدخل اسمك ورقم الغرفة!");
                State.player = { name, room, role };
                document.getElementById('setup-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('setup-screen').classList.add('hidden');
                    document.getElementById('loading-screen').classList.remove('hidden');
                    NetworkController.init();
                }, 400);
            },
            startGameplay() {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('hud-layer').classList.remove('hidden');
                document.getElementById('role-text').innerText = State.player.role === 'drawer' ? "الرسام 🎨" : "المهندس 🔧";
                document.getElementById('task-text').innerText = State.player.role === 'drawer' ? "ارسم اللغز وأرسله للمهندس" : "استخدم المؤشر (Crosshair) لتحريك القواطع";
                if (State.player.role === 'drawer') {
                    document.getElementById('btn-open-paper').style.display = 'block';
                    DrawingEngine.init(); DrawingEngine.open();
                }
                Graphics3D.init();
            },
            triggerWin() {
                const overlay = document.createElement('div'); overlay.className = 'overlay-screen';
                overlay.style.backgroundColor = 'rgba(16, 185, 129, 0.9)'; overlay.style.zIndex = '9999';
                overlay.innerHTML = `<h1 style="font-size: 3rem; color: #fff; text-shadow: 2px 2px 0 #000;">تم الحل!</h1>
                                     <button class="btn btn-warning" onclick="location.reload()" style="margin-top:20px;">العب مجدداً</button>`;
                document.body.appendChild(overlay);
            }
        };
    </script>
</body>
</html>
