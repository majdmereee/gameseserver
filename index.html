<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dark Tether - Advanced Engine (v10.0)</title>
    
    <!-- 1. استدعاء مكتبة Socket.IO للاتصال اللحظي كما في الوثيقة -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* ============================================================================
           [1] MASSIVE UI & HUD STYLING SYSTEM
           ============================================================================ */
        :root { --c-main: #3b82f6; --c-run: #ef4444; --c-bg: #010101; --c-hud: rgba(5,5,10,0.75); }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--c-bg); touch-action: none; }
        
        #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; outline: none; }
        
        /* CRT Scanlines Overlay */
        #crt-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%; opacity: 0.4; }
        
        /* Vignette Effect */
        #vignette { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%); }

        /* Professional Lobby */
        #lobby-ui { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #111520, #000); transition: opacity 1.5s ease, filter 1s ease; }
        .lobby-box { background: rgba(10, 12, 15, 0.95); border: 1px solid #334; padding: 60px; width: 90%; max-width: 550px; border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,1); position: relative; overflow: hidden; }
        .lobby-box::before { content: ''; position: absolute; top:-50%; left:-50%; width: 200%; height: 200%; background: conic-gradient(transparent, rgba(59, 130, 246, 0.2), transparent 40%); animation: spin 5s linear infinite; z-index: 0; }
        .lobby-content { position: relative; z-index: 1; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .game-title { text-align: center; color: #fff; font-size: 2.8rem; font-weight: 900; letter-spacing: 6px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(255,255,255,0.4); }
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; color: #8a9bb2; margin-bottom: 10px; font-weight: bold; font-size: 1rem; letter-spacing: 1.5px; }
        .lobby-input { width: 100%; padding: 18px; background: rgba(0,0,0,0.8); border: 2px solid #2a3b52; color: #fff; font-size: 1.3rem; text-align: center; outline: none; transition: 0.3s; border-radius: 6px; letter-spacing: 2px; }
        .lobby-input:focus { border-color: var(--c-main); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        
        .btn-group { display: flex; flex-direction: column; gap: 18px; margin-top: 40px; }
        .btn { padding: 20px; font-size: 1.25rem; font-weight: bold; color: #fff; border: none; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 3px; border-radius: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        .btn:active { transform: scale(0.95); }
        .btn-guide { background: linear-gradient(90deg, #1e3a8a, #2563eb); border: 1px solid #60a5fa; }
        .btn-runner { background: linear-gradient(90deg, #7f1d1d, #dc2626); border: 1px solid #f87171; }

        /* Main Game HUD */
        #hud-layer { position: absolute; inset: 0; z-index: 10; display: none; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.8); transition: 0.1s; }
        
        #top-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; font-size: 1rem; font-weight: bold; color: #cbd5e1; background: var(--c-hud); padding: 12px 35px; border-radius: 40px; border: 1px solid #334; backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.7); }
        #top-bar span { color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        
        /* Advanced Terminal HUD */
        #terminal-hud { position: absolute; top: 20px; left: 20px; width: 280px; height: 160px; background: rgba(0,10,0,0.65); border: 1px solid #0f0; border-radius: 8px; padding: 10px; font-size: 0.75rem; color: #0f0; display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(0,255,0,0.1); }
        .term-title { border-bottom: 1px solid #0f0; padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; letter-spacing: 1px; }
        #term-logs { flex: 1; overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
        
        /* Center Hint System */
        #hint-ui { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,5,0,0.95); border: 2px solid #ff4400; color: #ffaa00; padding: 25px 40px; font-size: 1.2rem; font-weight: bold; text-align: center; display: none; opacity: 0; transition: opacity 0.6s; width: 85%; max-width: 600px; line-height: 1.8; border-radius: 12px; box-shadow: 0 0 30px rgba(255,68,0,0.4); text-shadow: 0 0 8px rgba(255,68,0,0.6); }

        /* Communication Controls (Left Side) */
        .comm-panel { position: absolute; bottom: 30px; left: 25px; display: flex; gap: 15px; pointer-events: auto; }
        .comm-btn { width: 65px; height: 65px; background: rgba(15,15,20,0.85); border: 2px solid rgba(100,100,120,0.4); color: #fff; font-size: 1.8rem; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(8px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); touch-action: none; }
        .comm-btn.active { background: rgba(220, 38, 38, 0.95) !important; transform: scale(0.9); border-color: #ffaaaa; box-shadow: 0 0 30px rgba(255,0,0,0.8); }
        
        #chat-interface { position: absolute; bottom: 110px; left: 25px; width: 320px; height: 200px; background: rgba(5,5,10,0.92); border: 1px solid #445; border-radius: 12px; display: none; flex-direction: column; pointer-events: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.9); overflow: hidden; }
        #chat-msgs { flex: 1; overflow-y: auto; padding: 15px; color: #eee; font-size: 0.9rem; line-height: 1.6; }
        #chat-input { width: 100%; border: none; border-top: 1px solid #445; background: #111; color: #fff; padding: 15px; font-size: 1rem; outline: none; }
        #chat-input:focus { background: #1a1a24; }

        /* Action Controls (Right Side) */
        .action-panel { position: absolute; bottom: 30px; right: 25px; display: flex; flex-direction: column; gap: 20px; pointer-events: auto; }
        .action-btn { width: 75px; height: 75px; background: rgba(25,25,30,0.85); border: 2px solid rgba(255,255,255,0.25); color: #fff; font-size: 1.8rem; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); transition: 0.15s; touch-action: none; }
        .action-btn:active { transform: scale(0.85); background: rgba(50,50,60,0.9); }
        
        #btn-door { display: none; background: rgba(200, 100, 20, 0.85); border-color: #ffbb00; box-shadow: 0 0 20px rgba(255,150,0,0.4); }
        #btn-nvg { position: absolute; top: 25px; right: 25px; width: 70px; height: 70px; background: rgba(0,40,0,0.85); border: 2px solid #0f0; color: #0f0; font-size: 0.95rem; font-weight: bold; border-radius: 15px; display: none; pointer-events: auto; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        #btn-nvg.active { background: rgba(0,255,0,0.45); box-shadow: 0 0 35px #0f0; color: #fff; text-shadow: 0 0 8px #000; border-width: 3px; }

        /* Virtual Joystick (Touch Screen) */
        #touch-controls { position: absolute; inset: 0; z-index: 5; display: none; touch-action: none; pointer-events: none; }
        .touch-half { position: absolute; top: 0; height: 100%; pointer-events: auto; }
        #left-half { left: 0; width: 50%; }
        #right-half { right: 0; width: 50%; }
        #joystick-bg { position: absolute; width: 140px; height: 140px; border: 3px solid rgba(255,255,255,0.15); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,0.08), transparent); transition: opacity 0.25s; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #joystick-thumb { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

        /* Overlay Flashes (Damage/Sparks) */
        #flash-overlay { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 99; transition: opacity 0.2s ease-out; }
    </style>
</head>
<body>

    <div id="game-canvas"></div>
    <div id="crt-overlay"></div>
    <div id="vignette"></div>
    <div id="flash-overlay"></div>
    
    <!-- 2. واجهة الدخول (The Lobby) -->
    <div id="lobby-ui">
        <div class="lobby-box">
            <div class="lobby-content">
                <h1 class="game-title">TETHERED SOULS</h1>
                <div class="input-group">
                    <label>معرف الهوية السري (الاسم)</label>
                    <input type="text" id="inp-name" class="lobby-input" placeholder="مثال: Shadow99">
                </div>
                <div class="input-group">
                    <label>تردد السيرفر (رقم الغرفة)</label>
                    <input type="number" id="inp-room" class="lobby-input" placeholder="مثال: 7777">
                </div>
                <div class="btn-group">
                    <button class="btn btn-guide" onclick="GameEngine.boot('guide')">دخول كـ: المهندس (الرائي)</button>
                    <button class="btn btn-runner" onclick="GameEngine.boot('runner')">دخول كـ: المنفذ (المتحكم)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. واجهة اللعب الرئيسية (Main HUD) -->
    <div id="hud-layer">
        <div class="crosshair"></div>
        
        <div id="terminal-hud">
            <div class="term-title">SYSTEM LINK TERMINAL v4.2</div>
            <div id="term-logs">
                <div style="color:#555;">> Initialize... OK</div>
            </div>
        </div>

        <div id="top-bar">
            <div>المرحلة: <span id="level-num">1</span> / 50</div>
            <div>شد الجنزير: <span id="tension-val">0</span>%</div>
            <div>الشبكة: <span id="sync-status" style="color:#0f0;">مستقر</span></div>
        </div>
        
        <div id="hint-ui">...</div>
        <div id="btn-nvg">ناضور NVG</div>

        <div class="comm-panel">
            <div id="btn-mic" class="comm-btn" title="اضغط باستمرار للتحدث">🎙️</div>
            <div id="btn-chat" class="comm-btn">💬</div>
        </div>
        
        <div id="chat-interface">
            <div id="chat-msgs"></div>
            <input type="text" id="chat-input" placeholder="اكتب رسالة مشفرة...">
        </div>

        <div class="action-panel">
            <div id="btn-door" class="action-btn">🚪</div>
            <div id="btn-jump" class="action-btn">⬆️</div>
        </div>
    </div>

    <!-- 4. أزرار التحكم باللمس (Virtual Joystick) -->
    <div id="touch-controls">
        <div id="left-half" class="touch-half"></div>
        <div id="right-half" class="touch-half"></div>
        <div id="joystick-bg"><div id="joystick-thumb"></div></div>
    </div>

    <script>
        // ============================================================================
        // [MODULE 1] TERMINAL LOGGER (نظام تسجيل الأحداث على الشاشة)
        // ============================================================================
        const TerminalLogger = {
            logs: [],
            maxLogs: 6,
            log(msg, color = '#0f0') {
                this.logs.push(`<div style="color:${color};">> ${msg}</div>`);
                if(this.logs.length > this.maxLogs) this.logs.shift();
                document.getElementById('term-logs').innerHTML = this.logs.join('');
            }
        };

        // ============================================================================
        // [MODULE 2] ADVANCED AUDIO SYNTHESIZER (توليد أصوات مرعبة برمجياً بدون ملفات)
        // ============================================================================
        const AudioSynth = {
            ctx: null,
            init() {
                if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playTension(intensity) { 
                if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(30 + (intensity * 50), this.ctx.currentTime);
                // تأثير الرجفة
                const lfo = this.ctx.createOscillator();
                lfo.type = 'sine'; lfo.frequency.value = 15;
                const lfoGain = this.ctx.createGain(); lfoGain.gain.value = 20;
                lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start(); lfo.stop(this.ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(intensity * 0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            },
            playHit() {
                if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            },
            playStep() {
                if(!this.ctx || Math.random() > 0.3) return; // لا تشغل مع كل فريم
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(60, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            }
        };

        // ============================================================================
        // [MODULE 3] PROCEDURAL TEXTURE ENGINE (مولد الخامات المعقدة)
        // ============================================================================
        class TextureEngine {
            static generate(size, renderFunc) {
                const c = document.createElement('canvas');
                c.width = size; c.height = size;
                renderFunc(c.getContext('2d'), size);
                const tex = new THREE.CanvasTexture(c);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                return tex;
            }

            static get Floor() {
                return this.generate(64, (ctx) => {
                    ctx.fillStyle = '#080808'; ctx.fillRect(0,0,64,64);
                    ctx.fillStyle = '#111';
                    for(let i=0; i<64; i+=16) for(let j=0; j<64; j+=16) ctx.fillRect(i+1, j+1, 14, 14);
                    // أوساخ عشوائية
                    ctx.fillStyle = '#050505';
                    for(let i=0; i<80; i++) { ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2); }
                });
            }
            static get Ceiling() {
                return this.generate(32, (ctx) => {
                    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,32,32);
                    ctx.fillStyle = '#0a0a0a';
                    for(let i=0; i<32; i+=8) { ctx.fillRect(i, 0, 2, 32); ctx.fillRect(0, i, 32, 2); }
                });
            }
            static get Wall() {
                return this.generate(64, (ctx) => {
                    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,64,64);
                    ctx.fillStyle = '#0d0d0d';
                    for(let y=0; y<64; y+=16) ctx.fillRect(0, y+14, 64, 2); // خطوط أفقية
                    for(let y=0; y<64; y+=32) {
                        ctx.fillRect(16, y, 2, 14); ctx.fillRect(48, y, 2, 14);
                        ctx.fillRect(0, y+16, 2, 14); ctx.fillRect(32, y+16, 2, 14);
                    }
                });
            }
            static get GlassNVG() {
                return this.generate(32, (ctx) => {
                    ctx.fillStyle = 'rgba(0,25,0,0.6)'; ctx.fillRect(0,0,32,32);
                    ctx.fillStyle = 'rgba(0,255,0,0.2)';
                    ctx.fillRect(0,0,32,2); ctx.fillRect(0,30,32,2);
                    ctx.fillRect(0,0,2,32); ctx.fillRect(30,0,2,32);
                    ctx.fillStyle = 'rgba(0,255,0,0.7)'; ctx.fillRect(4,4,8,2); // انعكاس
                });
            }
            static get Door() {
                return this.generate(32, (ctx) => {
                    ctx.fillStyle = '#2a1a10'; ctx.fillRect(0,0,32,32);
                    ctx.fillStyle = '#1a0d05'; ctx.fillRect(2,2,28,28);
                    ctx.fillStyle = '#6a4a20'; ctx.fillRect(24,14,4,6); // مقبض
                });
            }
            static get Avatar() {
                return this.generate(32, (ctx) => {
                    ctx.fillStyle = '#111'; ctx.fillRect(0,0,32,32);
                    ctx.fillStyle = '#3b82f6'; ctx.fillRect(8,8,16,16); // قلب متوهج
                    ctx.fillStyle = '#fff'; ctx.fillRect(14,14,4,4);
                });
            }
            static get Monster() {
                return this.generate(32, (ctx) => {
                    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,32,32);
                    ctx.fillStyle = '#f00'; ctx.fillRect(6,8,6,4); ctx.fillRect(20,8,6,4); // عيون حمراء
                });
            }
        }

        // ============================================================================
        // [MODULE 4] PARTICLE SYSTEM (نظام الجزيئات للشرر والغبار)
        // ============================================================================
        class ParticleSystem {
            constructor(scene) {
                this.scene = scene;
                this.particles = [];
                this.geo = new THREE.BufferGeometry();
                this.mat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.1, transparent: true, opacity: 0.8 });
                this.mesh = new THREE.Points(this.geo, this.mat);
                this.scene.add(this.mesh);
                
                // إضافة غبار عائم دائم
                this.dustGeo = new THREE.BufferGeometry();
                this.dustMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.3 });
                this.dustMesh = new THREE.Points(this.dustGeo, this.dustMat);
                this.scene.add(this.dustMesh);
                this.initDust();
            }

            initDust() {
                const count = 500;
                const pos = new Float32Array(count * 3);
                for(let i=0; i<count*3; i++) pos[i] = (Math.random() - 0.5) * 50; // تناثر حول الخريطة
                this.dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            }

            spawnSparks(position, count = 20) {
                for(let i=0; i<count; i++) {
                    this.particles.push({
                        pos: position.clone(),
                        vel: new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10, (Math.random()-0.5)*10),
                        life: 1.0
                    });
                }
            }

            update(dt) {
                // تحديث الشرر
                let posArray = [];
                for(let i=this.particles.length-1; i>=0; i--) {
                    let p = this.particles[i];
                    p.life -= dt * 2.0;
                    if(p.life <= 0) { this.particles.splice(i, 1); continue; }
                    
                    p.vel.y -= 15 * dt; // جاذبية الشرر
                    p.pos.add(p.vel.clone().multiplyScalar(dt));
                    posArray.push(p.pos.x, p.pos.y, p.pos.z);
                }
                if(posArray.length > 0) {
                    this.geo.setAttribute('position', new THREE.Float32BufferAttribute(posArray, 3));
                } else {
                    this.geo.setAttribute('position', new THREE.Float32BufferAttribute([], 3));
                }

                // تحريك الغبار ببطء
                if (this.dustMesh) {
                    this.dustMesh.rotation.y += 0.05 * dt;
                }
            }
        }

        // ============================================================================
        // [MODULE 5] PROCEDURAL LEVEL ARCHITECT (بناء الخريطة)
        // ============================================================================
        const HINT_DATABASE = [
            "الظلام ليس فارغاً، إنه يراقبك.", "لا تبتعد عن شريكك، الجنزير هو حياتك.", 
            "المهندس يرى الأسرار، والمتحكم يملك القوة.", "سلط النور الحارق على العيون الحمراء.",
            "الجدران تتغير، لا تحفظ الطريق.", "الصمت قاتل، تحدث عبر اللاسلكي.",
            "القفز ينجيك من الأشواك.", "الباب يحتاج للمتحكم ليفتحه."
        ];

        class LevelArchitect {
            static build(levelNum) {
                const size = 13 + Math.floor(levelNum * 1.5);
                const s = (size % 2 === 0) ? size + 1 : size; 
                
                let grid = Array(s).fill().map(() => Array(s).fill(1));
                let doors = [], hints = [], spikes = [], exit = null;
                
                const carve = (x, y) => {
                    grid[y][x] = 0;
                    const dirs = [[0,-2], [0,2], [-2,0], [2,0]].sort(() => Math.random() - 0.5);
                    for(let d of dirs) {
                        const nx = x + d[0], ny = y + d[1];
                        if(nx > 0 && nx < s-1 && ny > 0 && ny < s-1 && grid[ny][nx] === 1) {
                            grid[y + d[1]/2][x + d[0]/2] = 0;
                            carve(nx, ny);
                        }
                    }
                };
                carve(1, 1);

                // ضمان طريق للنهاية (Room at end)
                for(let dy=0; dy<3; dy++) for(let dx=0; dx<3; dx++) {
                    if (s-2-dy > 0 && s-2-dx > 0) grid[s-2-dy][s-2-dx] = 0;
                }

                // الغرف الإضافية
                const roomCount = Math.floor(levelNum / 2);
                for(let i=0; i<roomCount; i++) {
                    let rx = Math.floor(Math.random()*(s-5))+2;
                    let ry = Math.floor(Math.random()*(s-5))+2;
                    for(let dy=0; dy<4; dy++) for(let dx=0; dx<4; dx++) {
                        if (ry+dy < s-1 && rx+dx < s-1) grid[ry+dy][rx+dx] = 0;
                    }
                }

                // تحديد المخرج
                exit = {x: s-3, z: s-3};
                grid[exit.z][exit.x] = 9;

                // توزيع العناصر
                for(let y=2; y<s-2; y++) {
                    for(let x=2; x<s-2; x++) {
                        if(grid[y][x] === 0 && Math.random() < 0.1) {
                            let type = Math.random();
                            if(type < 0.25) { grid[y][x] = 2; doors.push({x, z:y}); }
                            else if(type < 0.55 && levelNum > 2) { grid[y][x] = 3; spikes.push({x, z:y}); }
                            else if(type < 0.65) { 
                                grid[y][x] = 4; 
                                hints.push({x, z:y, text: HINT_DATABASE[Math.floor(Math.random()*HINT_DATABASE.length)]}); 
                            }
                        }
                    }
                }

                return { grid, size: s, doors, hints, spikes, exit, monsters: Math.floor(levelNum * 0.8), start: {x:1, z:1} };
            }
        }

        // ============================================================================
        // [MODULE 6] NETWORK CONTROLLER (الربط الموثوق بالسيرفر حسب الوثيقة)
        // ============================================================================
        const NetworkController = {
            socket: null,
            SERVER_URL: 'https://render-kr1o.onrender.com/',
            
            init() {
                try {
                    TerminalLogger.log("Connecting to core server...", "#ffaa00");
                    // لا نضع شاشة انتظار تغلق اللعبة، بل نسجل في الـ Terminal
                    this.socket = io(this.SERVER_URL, { transports: ['websocket'] });
                    
                    this.socket.on('connect', () => { 
                        document.getElementById('sync-status').innerText = "متصل";
                        document.getElementById('sync-status').style.color = "#0f0";
                        TerminalLogger.log("Link Established. Sync Active.", "#0f0");
                        
                        this.emitRaw('join_room', { room: GameEngine.state.room, name: GameEngine.state.name });
                    });

                    this.socket.on('disconnect', () => {
                        document.getElementById('sync-status').innerText = "مقطوع";
                        document.getElementById('sync-status').style.color = "#f00";
                        TerminalLogger.log("WARNING: Link Lost!", "#f00");
                    });
                    
                    this.socket.on('otherPlayerMoved', (data) => this.processIncoming(data));
                    this.socket.on('chatMsg', (data) => GameEngine.commSys.handleChat(data));
                    this.socket.on('voiceData', (data) => GameEngine.commSys.handleVoice(data));
                    
                } catch (e) { 
                    TerminalLogger.log("FATAL: Network Init Failed", "#f00");
                }
            },
            
            emit(type, payload) { 
                if (this.socket?.connected) {
                    this.socket.emit('playerMoved', { 
                        type, room: GameEngine.state.room, role: GameEngine.state.role, ...payload 
                    }); 
                }
            },
            
            emitRaw(eventName, payload) {
                if (this.socket?.connected) this.socket.emit(eventName, payload);
            },
            
            processIncoming(data) {
                if (data.room !== GameEngine.state.room || data.role === GameEngine.state.role) return; 
                
                switch (data.type) {
                    case 'sync_pos': 
                        GameEngine.remoteTargetPos.set(data.x, data.y, data.z);
                        if (data.lvl > GameEngine.state.level) {
                            GameEngine.state.level = data.lvl;
                            GameEngine.loadLevel(data.lvl);
                        }
                        break;
                    case 'door_toggle': 
                        const door = GameEngine.doors.find(d => d.gx === data.gx && d.gz === data.gz);
                        if (door) {
                            door.open = data.open;
                            door.targetRot = door.open ? Math.PI / 2 : 0;
                            TerminalLogger.log("Partner breached a door.");
                        }
                        break;
                }
            }
        };

        // ============================================================================
        // [MODULE 7] COMMUNICATION SYSTEM (Walkie-Talkie & Chat)
        // ============================================================================
        class CommunicationSystem {
            constructor(room, role) {
                this.room = room; this.role = role;
                
                this.chatBtn = document.getElementById('btn-chat');
                this.chatBox = document.getElementById('chat-interface');
                this.chatInput = document.getElementById('chat-input');
                this.chatMsgs = document.getElementById('chat-msgs');
                
                let chatOpen = false;
                this.chatBtn.addEventListener('click', () => {
                    chatOpen = !chatOpen;
                    this.chatBox.style.display = chatOpen ? 'flex' : 'none';
                    if(chatOpen) this.chatInput.focus();
                });

                this.chatInput.addEventListener('keypress', (e) => {
                    if(e.key === 'Enter' && this.chatInput.value.trim() !== '') {
                        const msg = this.chatInput.value.trim();
                        this.appendMsg('أنت', msg, '#3b82f6');
                        NetworkController.emitRaw('chatMsg', { room: this.room, sender: this.role, text: msg });
                        this.chatInput.value = '';
                    }
                });

                this.micBtn = document.getElementById('btn-mic');
                this.peer = null;
                this.localStream = null;
                this.audioCtx = null; 

                const startMic = async (e) => {
                    if(e) e.preventDefault();
                    this.micBtn.classList.add('active');
                    AudioEngine.init();
                    if(this.localStream && this.localStream.getAudioTracks()[0]) {
                        this.localStream.getAudioTracks()[0].enabled = true; 
                    } else {
                        await this.initLiveCall();
                        if(this.localStream) this.localStream.getAudioTracks()[0].enabled = true;
                    }
                };

                const stopMic = (e) => {
                    if(e) e.preventDefault();
                    this.micBtn.classList.remove('active');
                    if(this.localStream && this.localStream.getAudioTracks()[0]) {
                        this.localStream.getAudioTracks()[0].enabled = false; 
                    }
                };

                this.micBtn.addEventListener('pointerdown', startMic);
                this.micBtn.addEventListener('pointerup', stopMic);
                this.micBtn.addEventListener('pointerleave', stopMic);
            }

            handleChat(data) {
                if(data.sender !== this.role) {
                    this.appendMsg(data.sender, data.text, '#ef4444');
                    TerminalLogger.log("Incoming message received.", "#aaccff");
                }
            }

            async handleVoice(data) {
                if(data.role !== this.role && data.signal) {
                    if(!this.peer) this.initPeer();
                    if(data.signal.sdp) {
                        await this.peer.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                        if(data.signal.sdp.type === 'offer') {
                            const ans = await this.peer.createAnswer();
                            await this.peer.setLocalDescription(ans);
                            NetworkController.emitRaw('voiceData', { room: this.room, role: this.role, signal: { sdp: this.peer.localDescription } });
                        }
                    } else if(data.signal.ice) {
                        await this.peer.addIceCandidate(new RTCIceCandidate(data.signal.ice));
                    }
                }
            }

            async initLiveCall() {
                if(this.localStream) return;
                try {
                    this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.localStream.getAudioTracks()[0].enabled = false; 
                    
                    if(!this.peer) this.initPeer();
                    this.localStream.getTracks().forEach(t => this.peer.addTrack(t, this.localStream));
                    const offer = await this.peer.createOffer();
                    await this.peer.setLocalDescription(offer);
                    NetworkController.emitRaw('voiceData', { room: this.room, role: this.role, signal: { sdp: this.peer.localDescription } });
                } catch(e) { TerminalLogger.log("MIC ERROR: " + e.message, "#f00"); }
            }

            initPeer() {
                this.peer = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                this.peer.onicecandidate = e => {
                    if(e.candidate) NetworkController.emitRaw('voiceData', { room: this.room, role: this.role, signal: { ice: e.candidate } });
                };
                
                this.peer.ontrack = e => {
                    let audio = document.getElementById('live-audio');
                    if(!audio) {
                        audio = document.createElement('audio');
                        audio.id = 'live-audio'; audio.autoplay = true; audio.muted = true; 
                        document.body.appendChild(audio);
                    }
                    audio.srcObject = e.streams[0];
                    this.applyRadioEffect(audio, e.streams[0]);
                };
            }

            applyRadioEffect(audioElement, stream) {
                if (!this.audioCtx) this.audioCtx = AudioEngine.ctx || new (window.AudioContext || window.webkitAudioContext)();
                const source = this.audioCtx.createMediaStreamSource(stream);
                const bandpass = this.audioCtx.createBiquadFilter();
                bandpass.type = 'bandpass'; bandpass.frequency.value = 1500; bandpass.Q.value = 1.0; 
                
                const distortion = this.audioCtx.createWaveShaper();
                distortion.curve = this.makeDistortionCurve(20);
                distortion.oversample = '4x';

                source.connect(bandpass);
                bandpass.connect(distortion);
                distortion.connect(this.audioCtx.destination);
                this.audioCtx.resume();
            }

            makeDistortionCurve(amount) {
                let k = typeof amount === 'number' ? amount : 50, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180, i = 0, x;
                for ( ; i < n_samples; ++i ) {
                    x = i * 2 / n_samples - 1;
                    curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
                }
                return curve;
            }

            appendMsg(sender, text, color) {
                this.chatMsgs.innerHTML += `<div style="margin-bottom:8px; border-bottom: 1px solid #333; padding-bottom: 5px;"><span style="color:${color}; font-weight:bold;">[${sender}]:</span> ${text}</div>`;
                this.chatMsgs.scrollTop = this.chatMsgs.scrollHeight;
            }
        }

        // ============================================================================
        // [MODULE 8] CORE GAME ENGINE (القلب النابض للعبة والفيزياء)
        // ============================================================================
        const GameEngine = {
            state: { role: '', room: '', name: '', level: 1, tetherMax: 2.0 }, // 2.0 units (approx 1 meter)
            input: { mx: 0, my: 0, isJumping: false },
            
            boot(role) {
                this.state.name = document.getElementById('inp-name').value.trim();
                this.state.room = document.getElementById('inp-room').value.trim();
                if(!this.state.name || !this.state.room) return alert('أدخل هويتك وتردد السيرفر أولاً!');
                
                this.state.role = role;
                document.getElementById('lobby-ui').style.opacity = '0';
                
                // بدء الاتصال بالسيرفر فوراً (بدون شاشة انتظار تغلق اللعبة)
                NetworkController.init();

                setTimeout(() => {
                    document.getElementById('lobby-ui').style.display = 'none';
                    document.getElementById('hud-layer').style.display = 'block';
                    document.getElementById('touch-controls').style.display = 'block';
                    this.init3D();
                }, 1000);
            },

            init3D() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x010101);

                this.camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 100);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
                document.getElementById('game-canvas').appendChild(this.renderer.domElement);

                // خامات متقدمة تتفاعل مع الإضاءة
                this.mats = {
                    floor: new THREE.MeshPhongMaterial({ map: TextureEngine.Floor, shininess: 5 }),
                    ceil: new THREE.MeshPhongMaterial({ map: TextureEngine.Ceiling, shininess: 0 }),
                    wall: new THREE.MeshPhongMaterial({ map: TextureEngine.Wall, shininess: 10 }),
                    nvgWall: new THREE.MeshBasicMaterial({ map: TextureEngine.GlassNVG, transparent: true, opacity: 0.65, side: THREE.DoubleSide }),
                    door: new THREE.MeshPhongMaterial({ map: TextureEngine.Door, shininess: 20 }),
                    hint: new THREE.MeshPhongMaterial({ color: 0xff4400, emissive: 0x551100 }),
                    spike: new THREE.MeshPhongMaterial({ color: 0x555555, shininess: 30 }),
                    exit: new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true, transparent: true, opacity: 0.5 })
                };

                this.worldGroup = new THREE.Group();
                this.scene.add(this.worldGroup);

                this.guidePos = new THREE.Vector3();
                this.runnerPos = new THREE.Vector3();
                this.localPos = this.state.role === 'guide' ? this.guidePos : this.runnerPos;
                this.remotePos = this.state.role === 'guide' ? this.runnerPos : this.guidePos;
                this.remoteTargetPos = this.remotePos.clone();
                
                this.velY = 0; this.isGrounded = true;

                this.particles = new ParticleSystem(this.scene);
                
                this.setupRoleLogic();
                this.setupInputs();
                this.createAvatarAndTether();
                
                this.commSys = new CommunicationSystem(this.state.room, this.state.role);
                this.loadLevel(this.state.level);

                this.clock = new THREE.Clock();
                TerminalLogger.log("3D Engine Initialized.", "#3b82f6");
                
                this.renderer.setAnimationLoop(() => this.tick());
            },

            createAvatarAndTether() {
                // مجسم اللاعب الآخر مع إضاءة خفيفة لتمييزه
                const avatarGeo = new THREE.CapsuleGeometry(0.35, 1.1, 4, 8);
                const avatarMat = new THREE.MeshPhongMaterial({ map: TextureEngine.Avatar, emissive: 0x112244, emissiveIntensity: 0.5 });
                this.avatarMesh = new THREE.Mesh(avatarGeo, avatarMat);
                this.scene.add(this.avatarMesh);

                // ضوء خفيف يرافق الأفاتار
                this.avatarLight = new THREE.PointLight(0x3b82f6, 0.5, 3.0);
                this.avatarMesh.add(this.avatarLight);

                // الجنزير الفيزيائي المرئي
                const tetherMat = new THREE.LineBasicMaterial({ color: 0x666666, linewidth: 3 });
                const tetherGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()]);
                this.tetherLine = new THREE.Line(tetherGeo, tetherMat);
                this.scene.add(this.tetherLine);
            },

            loadLevel(num) {
                document.getElementById('level-num').innerText = num;
                TerminalLogger.log(`Entering Sector: ${num}`);
                
                while(this.worldGroup.children.length > 0) this.worldGroup.remove(this.worldGroup.children[0]);
                
                this.lvl = LevelArchitect.build(num);
                this.blockSize = 2; 
                const b = this.blockSize;
                
                this.doors = []; this.spikes = []; this.hints = []; this.monsters = [];
                
                const boxGeo = new THREE.BoxGeometry(b, b*2, b);
                const planeGeo = new THREE.PlaneGeometry(b, b);
                
                for(let z=0; z<this.lvl.size; z++) {
                    for(let x=0; x<this.lvl.size; x++) {
                        const px = x*b, pz = z*b;
                        
                        // أرضية
                        const f = new THREE.Mesh(planeGeo, this.mats.floor);
                        f.rotation.x = -Math.PI/2; f.position.set(px, 0, pz);
                        this.worldGroup.add(f);

                        // سقف
                        const c = new THREE.Mesh(planeGeo, this.mats.ceil);
                        c.rotation.x = Math.PI/2; c.position.set(px, b*2, pz);
                        this.worldGroup.add(c);

                        let type = this.lvl.grid[z][x];
                        if(type === 1) {
                            const w = new THREE.Mesh(boxGeo, this.mats.wall);
                            w.position.set(px, b, pz);
                            this.worldGroup.add(w);
                        } else if(type === 2) {
                            const dGrp = new THREE.Group(); dGrp.position.set(px-b/2, 0, pz);
                            const d = new THREE.Mesh(new THREE.BoxGeometry(b, b*2, b*0.2), this.mats.door);
                            d.position.set(b/2, b, 0); dGrp.add(d);
                            this.worldGroup.add(dGrp);
                            this.doors.push({ x:px, z:pz, gx:x, gz:z, grp: dGrp, open: false, rot:0 });
                        } else if(type === 3) {
                            const s = new THREE.Mesh(new THREE.ConeGeometry(b/2.5, b, 4), this.mats.spike);
                            s.position.set(px, -b, pz);
                            this.worldGroup.add(s);
                            this.spikes.push({ mesh: s, active: false, timer: Math.random()*3 });
                        } else if(type === 4) {
                            const h = new THREE.Mesh(new THREE.BoxGeometry(b*0.5, b*0.5, b*0.5), this.mats.hint);
                            h.position.set(px, b, pz);
                            this.worldGroup.add(h);
                            this.hints.push({ pos: new THREE.Vector3(px,b,pz), mesh: h, text: this.lvl.hints.find(hi=>hi.x===x && hi.z===z).text });
                        } else if(type === 9) {
                            this.exitMesh = new THREE.Mesh(boxGeo, this.mats.exit);
                            this.exitMesh.position.set(px, b, pz);
                            this.worldGroup.add(this.exitMesh);
                        }
                    }
                }

                // الوحوش
                for(let i=0; i<this.lvl.monsters; i++) {
                    const mGeo = new THREE.BoxGeometry(1.2, 2.2, 1.2);
                    const mMat = new THREE.MeshPhongMaterial({ map: TextureEngine.Monster, emissive: 0x330000 });
                    const m = new THREE.Mesh(mGeo, mMat);
                    let mx = Math.floor(Math.random()*this.lvl.size); let mz = Math.floor(Math.random()*this.lvl.size);
                    if(this.lvl.grid[mz][mx]===0) {
                        m.position.set(mx*b, 1.1, mz*b);
                        this.worldGroup.add(m);
                        this.monsters.push({ mesh: m, hp: 100, dir: new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).normalize() });
                    }
                }

                // الحساب الدقيق لنقاط البداية لضمان عدم السقوط خارج الخريطة
                const startNode = this.lvl.start; 
                const st = new THREE.Vector3(startNode.x * b, 2.0, startNode.z * b); // y=2.0 هو ارتفاع الكاميرا
                
                this.guidePos.copy(st).add(new THREE.Vector3(-0.2, 0, 0));
                this.runnerPos.copy(st).add(new THREE.Vector3(0.2, 0, 0));
                
                this.localPos = this.state.role === 'guide' ? this.guidePos : this.runnerPos;
                this.remotePos = this.state.role === 'guide' ? this.runnerPos : this.guidePos;
                this.remoteTargetPos.copy(this.remotePos);
                
                this.camera.position.copy(this.localPos);
            },

            setupRoleLogic() {
                // إضاءة محيطية عامة خفيفة جداً لكي لا يكون العالم أسود تماماً
                this.ambient = new THREE.AmbientLight(0xffffff, 0.05);
                this.scene.add(this.ambient);

                if (this.state.role === 'guide') {
                    // الرائي: ضباب كثيف، كشاف أزرق، وضوء ارتدادي
                    this.scene.fog = new THREE.FogExp2(0x010102, 0.18);
                    
                    this.guideFlash = new THREE.SpotLight(0xaaccff, 5.0, 20.0, Math.PI / 4, 0.8, 1.5);
                    this.guideFlash.position.set(0.4, -0.2, 0); 
                    this.camera.add(this.guideFlash);
                    this.guideFlash.target.position.set(0.4, -0.2, -5);
                    this.camera.add(this.guideFlash.target);
                    
                    this.bounceLight = new THREE.PointLight(0xaaccff, 0.3, 4.0);
                    this.camera.add(this.bounceLight);
                    this.scene.add(this.camera);

                    this.nvgBtn = document.getElementById('btn-nvg');
                    this.nvgBtn.style.display = 'flex';
                    this.nvgState = false;
                    
                    this.nvgBtn.addEventListener('click', () => {
                        this.nvgState = !this.nvgState;
                        this.nvgBtn.classList.toggle('active');
                        TerminalLogger.log(this.nvgState ? "NVG Goggles: ACTIVATED" : "NVG Goggles: DEACTIVATED", "#0f0");
                        
                        this.worldGroup.children.forEach(c => {
                            if(c.geometry.type === 'BoxGeometry' && (c.material === this.mats.wall || c.material === this.mats.nvgWall)) {
                                c.material = this.nvgState ? this.mats.nvgWall : this.mats.wall;
                            }
                        });

                        if(this.nvgState) {
                            this.scene.background.setHex(0x001a00);
                            this.ambient.color.setHex(0x00ff00);
                            this.ambient.intensity = 0.6;
                            this.scene.fog.color.setHex(0x001a00);
                            this.guideFlash.intensity = 1.0; 
                        } else {
                            this.scene.background.setHex(0x010101);
                            this.ambient.color.setHex(0xffffff);
                            this.ambient.intensity = 0.05;
                            this.scene.fog.color.setHex(0x010102);
                            this.guideFlash.intensity = 5.0;
                        }
                    });

                } else {
                    // المتحكم: ضباب متوسط، كشاف أصفر ناري
                    this.scene.fog = new THREE.FogExp2(0x010101, 0.12);
                    
                    this.flash = new THREE.SpotLight(0xffeedd, 7.0, 35.0, Math.PI / 5, 0.8, 1.2);
                    this.flash.position.set(0.5, -0.3, 0); 
                    this.camera.add(this.flash);
                    this.flash.target.position.set(0.5, -0.3, -5);
                    this.camera.add(this.flash.target);

                    this.bounceLight = new THREE.PointLight(0xffddaa, 0.4, 6.0);
                    this.camera.add(this.bounceLight);
                    this.scene.add(this.camera); 
                    
                    this.doorBtn = document.getElementById('btn-door');
                    this.doorBtn.addEventListener('click', () => {
                        if(this.nearDoor) {
                            this.nearDoor.open = !this.nearDoor.open;
                            this.nearDoor.targetRot = this.nearDoor.open ? Math.PI/2 : 0;
                            TerminalLogger.log("Breaching secure door...", "#ffaa00");
                            NetworkController.emit('door_toggle', { 
                                gx: this.nearDoor.gx, gz: this.nearDoor.gz, open: this.nearDoor.open 
                            });
                        }
                    });
                }
            },

            setupInputs() {
                const zL = document.getElementById('left-half');
                const zR = document.getElementById('right-half');
                const jBg = document.getElementById('joystick-bg');
                const jTh = document.getElementById('joystick-thumb');

                let mId = null, lId = null, mOrg = {x:0, y:0}, lLast = {x:0, y:0};

                zL.addEventListener('pointerdown', e => {
                    mId = e.pointerId; zL.setPointerCapture(mId); mOrg = {x: e.clientX, y: e.clientY};
                    jBg.style.opacity = '1'; jBg.style.left = e.clientX + 'px'; jBg.style.top = e.clientY + 'px';
                    jTh.style.transform = `translate(-50%, -50%)`;
                });
                zL.addEventListener('pointermove', e => {
                    if(e.pointerId === mId) {
                        let dx = e.clientX - mOrg.x, dy = e.clientY - mOrg.y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        let maxDist = 45;
                        if(dist > maxDist) { dx=(dx/dist)*maxDist; dy=(dy/dist)*maxDist; }
                        jTh.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        this.input.mx = Math.abs(dx/maxDist)>0.15 ? dx/maxDist : 0;
                        this.input.my = Math.abs(dy/maxDist)>0.15 ? dy/maxDist : 0;
                    }
                });
                const stopM = e => { if(e.pointerId===mId){ mId=null; jBg.style.opacity='0'; this.input.mx=this.input.my=0; }};
                zL.addEventListener('pointerup', stopM); zL.addEventListener('pointercancel', stopM);

                zR.addEventListener('pointerdown', e => { lId = e.pointerId; zR.setPointerCapture(lId); lLast = {x: e.clientX, y: e.clientY}; });
                zR.addEventListener('pointermove', e => {
                    if(e.pointerId === lId) {
                        let dx = e.clientX - lLast.x, dy = e.clientY - lLast.y;
                        lLast = {x: e.clientX, y: e.clientY};
                        this.camera.rotation.y -= dx * 0.005;
                        this.camera.rotation.x -= dy * 0.005;
                        this.camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, this.camera.rotation.x));
                        this.camera.rotation.order = "YXZ"; 
                    }
                });
                const stopL = e => { if(e.pointerId===lId) lId=null; };
                zR.addEventListener('pointerup', stopL); zR.addEventListener('pointercancel', stopL);

                document.getElementById('btn-jump').addEventListener('pointerdown', () => {
                    if(this.isGrounded) { this.velY = 7.5; this.isGrounded = false; }
                });
            },

            checkCol(x, z) {
                const b = this.blockSize;
                // الحساب الدقيق للمكان بالشبكة
                const gx = Math.round(x/b), gz = Math.round(z/b);
                if(gx<0 || gx>=this.lvl.size || gz<0 || gz>=this.lvl.size) return true;
                
                const t = this.lvl.grid[gz][gx];
                if(t===1) return true;
                if(t===2) {
                    const door = this.doors.find(d=>d.gx===gx && d.gz===gz);
                    if(door && !door.open) return true;
                }
                return false;
            },

            updateVisuals() {
                // تنعيم حركة اللاعب الآخر بشكل احترافي (Interpolation)
                this.remotePos.lerp(this.remoteTargetPos, 0.25); 
                this.avatarMesh.position.copy(this.remotePos);
                this.avatarMesh.position.y -= 0.6; // مركز الكبسولة تحت الكاميرا
                
                // حساب رسم الجنزير الفيزيائي باستخدام CatmullRomCurve
                const dist = this.localPos.distanceTo(this.remotePos);
                const p1 = this.localPos.clone().add(new THREE.Vector3(0, -0.5, 0));
                const p4 = this.remotePos.clone().add(new THREE.Vector3(0, -0.5, 0));
                
                // مقدار الارتخاء بناء على المسافة المتبقية
                const sag = Math.max(0, (this.state.tetherMax - dist) * 0.8);
                const p2 = p1.clone().lerp(p4, 0.33).add(new THREE.Vector3(0, -sag, 0));
                const p3 = p1.clone().lerp(p4, 0.66).add(new THREE.Vector3(0, -sag, 0));
                
                const curve = new THREE.CatmullRomCurve3([p1, p2, p3, p4]);
                this.tetherLine.geometry.setFromPoints(curve.getPoints(12));

                // تغيير اللون والتوتر
                let tensionPercent = Math.min(100, Math.round((dist / this.state.tetherMax) * 100));
                document.getElementById('tension-val').innerText = tensionPercent;
                
                if (dist > this.state.tetherMax * 0.95) {
                    this.tetherLine.material.color.setHex(0xff0000); // مشدود للاقصى (أحمر)
                    document.getElementById('tension-val').style.color = '#f00';
                    if (Math.random() < 0.1) {
                        AudioSynth.playTension(1.0);
                        this.particles.spawnSparks(p1.clone().lerp(p4, 0.5), 2); // شرار الجنزير
                    }
                } else if (dist > this.state.tetherMax * 0.7) {
                    this.tetherLine.material.color.setHex(0xffaa00); // برتقالي
                    document.getElementById('tension-val').style.color = '#fa0';
                } else {
                    this.tetherLine.material.color.setHex(0x555555); // مرتخي
                    document.getElementById('tension-val').style.color = '#0f0';
                }
            },

            tick() {
                const dt = Math.min(this.clock.getDelta(), 0.05); // منع قفزات الإطارات العالية
                
                // 1. تحديث الجزيئات
                this.particles.update(dt);
                AudioSynth.init(); // ضمان تفعيل الصوت

                // 2. حساب الحركة المطلوبة
                const spd = 4.8 * dt;
                const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion);
                const rgt = new THREE.Vector3(1,0,0).applyQuaternion(this.camera.quaternion);
                fwd.y=0; rgt.y=0; fwd.normalize(); rgt.normalize();

                let mDir = new THREE.Vector3();
                mDir.addScaledVector(fwd, -this.input.my);
                mDir.addScaledVector(rgt, this.input.mx);
                
                if(mDir.length() > 0.1) AudioSynth.playStep(); // صوت خطوات
                
                mDir.normalize().multiplyScalar(spd);

                // الموقع المستهدف
                let nextPos = this.localPos.clone().add(mDir);

                // ==========================================================
                // 3. إصلاح وتطوير حركة الرائي (Sliding Tether Bound)
                // ==========================================================
                if (this.state.role === 'guide') {
                    const distToMaster = nextPos.distanceTo(this.remotePos);
                    if (distToMaster > this.state.tetherMax) {
                        // إزاحة الموقع ليكون على حافة المحيط المسموح بالضبط بدلاً من التجميد
                        const dirFromMaster = nextPos.clone().sub(this.remotePos).normalize();
                        nextPos = this.remotePos.clone().add(dirFromMaster.multiplyScalar(this.state.tetherMax));
                    }
                }

                // 4. التصادم مع الجدران (انزلاق الجدار)
                if(this.checkCol(nextPos.x, this.localPos.z)) nextPos.x = this.localPos.x;
                if(this.checkCol(this.localPos.x, nextPos.z)) nextPos.z = this.localPos.z;

                // 5. فيزياء الجاذبية
                this.velY -= 20 * dt; 
                let ny = this.localPos.y + (this.velY * dt);
                if(ny <= 2.0) { ny = 2.0; this.velY = 0; this.isGrounded = true; }
                
                this.localPos.set(nextPos.x, ny, nextPos.z);

                // ==========================================================
                // 6. فيزياء السحب القسري (Forced Dragging)
                // ==========================================================
                const currentDist = this.localPos.distanceTo(this.remotePos);
                if (this.state.role === 'guide' && currentDist > this.state.tetherMax) {
                    const pullDir = this.remotePos.clone().sub(this.localPos).normalize();
                    const dragAmount = currentDist - this.state.tetherMax;
                    
                    let draggedPos = this.localPos.clone().add(pullDir.multiplyScalar(dragAmount));
                    
                    if(this.checkCol(draggedPos.x, this.localPos.z)) draggedPos.x = this.localPos.x;
                    if(this.checkCol(this.localPos.x, draggedPos.z)) draggedPos.z = this.localPos.z;
                    
                    this.localPos.set(draggedPos.x, this.localPos.y, draggedPos.z);
                }

                // 7. تحريك الكاميرا وإضافة اهتزاز خفيف أثناء المشي (Head Bobbing)
                let walkBob = this.isGrounded && mDir.length() > 0 ? Math.sin(Date.now() * 0.01) * 0.05 : 0;
                this.camera.position.set(this.localPos.x, this.localPos.y + walkBob, this.localPos.z);

                // 8. تحديثات العالم والبصريات
                this.updateVisuals();
                this.updateWorld(dt);
                this.checkInteractions();
                
                // 9. إرسال الموقع باستمرار للسيرفر (Sync)
                NetworkController.emitRaw('playerMoved', { 
                    type: 'sync_pos', room: this.state.room, role: this.state.role, 
                    lvl: this.state.level, x: this.localPos.x, y: this.localPos.y, z: this.localPos.z 
                });

                this.renderer.render(this.scene, this.camera);
            },

            updateWorld(dt) {
                // الأبواب
                this.nearDoor = null;
                for(let d of this.doors) {
                    d.grp.rotation.y += (d.targetRot || 0 - d.grp.rotation.y) * 10 * dt;
                    if(this.state.role === 'runner' && this.localPos.distanceTo(new THREE.Vector3(d.x, 2, d.z)) < 2.5) {
                        this.nearDoor = d;
                    }
                }
                if(this.state.role === 'runner') this.doorBtn.style.display = this.nearDoor ? 'flex' : 'none';

                // الأشواك
                for(let s of this.spikes) {
                    s.timer -= dt;
                    if(s.timer <= 0) { s.active = !s.active; s.timer = 1.5 + Math.random(); }
                    s.mesh.position.y += ((s.active ? 0 : -this.blockSize) - s.mesh.position.y) * 15 * dt;
                    
                    if(s.active && this.isGrounded && Math.abs(this.localPos.x-s.mesh.position.x)<1.2 && Math.abs(this.localPos.z-s.mesh.position.z)<1.2) {
                        this.velY = 6; this.isGrounded = false; // ضربة قوية للأعلى
                        AudioSynth.playHit();
                        document.getElementById('flash-overlay').style.background = '#f00';
                        document.getElementById('flash-overlay').style.opacity = '0.6';
                        setTimeout(() => document.getElementById('flash-overlay').style.opacity='0', 300);
                    }
                }

                // الوحوش
                let actFlash = (this.state.role === 'runner' && this.flash) ? this.flash : ((this.state.role === 'guide' && this.guideFlash) ? this.guideFlash : null);
                let fDir = actFlash ? new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion) : null;
                
                for(let i = this.hints.length-1; i>=0; i--) {
                    this.hints[i].mesh.rotation.y += dt; // لف المكعبات التلميحية
                    this.hints[i].mesh.position.y = 2.0 + Math.sin(Date.now()*0.002)*0.2; // تطفو
                }

                for(let i = this.monsters.length-1; i>=0; i--) {
                    let m = this.monsters[i];
                    if(fDir) {
                        const toM = m.mesh.position.clone().sub(this.localPos);
                        if(toM.length() < 12.0 && fDir.dot(toM.normalize()) > 0.85) {
                            m.hp -= (this.state.role === 'runner' ? 70 : 25) * dt;
                            m.mesh.material.color.setHex(0xff5555);
                            this.particles.spawnSparks(m.mesh.position, 1); // شرار عند الاحتراق
                            if(m.hp <= 0) {
                                AudioSynth.playHit();
                                this.particles.spawnSparks(m.mesh.position, 30); // انفجار جزيئات عند الموت
                                this.worldGroup.remove(m.mesh); this.monsters.splice(i,1);
                                document.getElementById('flash-overlay').style.background = '#fff';
                                document.getElementById('flash-overlay').style.opacity = '0.7';
                                setTimeout(() => document.getElementById('flash-overlay').style.opacity='0', 150);
                                TerminalLogger.log("Entity Neutralized.", "#aaaaff");
                                continue;
                            }
                        } else m.mesh.material.color.setHex(0xffffff);
                    }
                    
                    let nP = m.mesh.position.clone().add(m.dir.clone().multiplyScalar(1.5*dt));
                    if(this.checkCol(nP.x, nP.z)) m.dir.set(Math.random()-0.5,0,Math.random()-0.5).normalize();
                    else m.mesh.position.copy(nP);
                }
            },

            checkInteractions() {
                let hTxt = null;
                for(let h of this.hints) if(this.localPos.distanceTo(h.pos) < 3.5) hTxt = h.text;
                
                const hUi = document.getElementById('hint-ui');
                if(hTxt) { 
                    hUi.innerText = hTxt; hUi.style.display = 'block'; hUi.style.opacity = '1'; 
                } else { 
                    hUi.style.opacity = '0'; 
                    setTimeout(()=>{ if(hUi.style.opacity==='0') hUi.style.display='none'; }, 600); 
                }

                if(this.exitMesh && this.localPos.distanceTo(this.exitMesh.position) < 2.5) {
                    TerminalLogger.log("Sector Cleared! Advancing...", "#0f0");
                    this.state.level++; this.loadLevel(this.state.level);
                }
            }
        };
    </script>
