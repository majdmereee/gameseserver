<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوكي نيون أونلاين 🏑</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; touch-action: none; }
        .container { background: #1e1e24; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,204,0.1); text-align: center; width: 90%; max-width: 400px; z-index: 10; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        input { width: 85%; padding: 12px; margin: 15px 0; border: 2px solid #555; background: #121212; color: #fff; border-radius: 8px; text-align: center; }
        button { padding: 15px; background: #00ffcc; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; width: 100%; transition: 0.3s;}
        button:hover { box-shadow: 0 0 15px #00ffcc; }
        #gameArea { display: none; flex-direction: column; align-items: center; }
        #status { margin: 10px 0; font-size: 1.2em; font-weight: bold; color: #ffcc00; }
        .score-board { display: flex; justify-content: space-between; width: 100%; max-width: 400px; font-size: 1.5em; font-weight: bold; margin-bottom: 10px; }
        .score-p2 { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .score-p1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        canvas { background: #1a1a24; border: 3px solid #333; border-radius: 10px; box-shadow: inset 0 0 20px #000; max-width: 100%; }
    </style>
</head>
<body>

    <div class="container" id="loginArea">
        <h1>هوكي نيون 🏑</h1>
        <p>أدخل اسمك وانتظر الخصم تلقائياً!</p>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." required>
        <button onclick="findMatch()" id="joinBtn">بحث عن منافس 🔍</button>
    </div>

    <div id="gameArea">
        <div class="score-board">
            <div class="score-p2" id="score2">0 (الخصم)</div>
            <div id="status">جاري الاتصال...</div>
            <div class="score-p1" id="score1">(أنت) 0</div>
        </div>
        <canvas id="hockeyBoard" width="400" height="600"></canvas>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const SERVER_URL = 'https://render-kr1o.onrender.com/';
        let socket;
        let myName = "";
        let myRole = 0; // 1 (أزرق)، 2 (أحمر)
        let roomName = "";
        let gameOver = false;

        const canvas = document.getElementById('hockeyBoard');
        const ctx = canvas.getContext('2d');
        
        let gameState = { p1: {x:200, y:520}, p2: {x:200, y:80}, puck: {x:200, y:300} };

        function findMatch() {
            myName = document.getElementById('playerName').value.trim();
            if (!myName) return alert("الرجاء إدخال اسمك!");

            document.getElementById('joinBtn').innerText = "جاري الاتصال...";
            socket = io(SERVER_URL);

            socket.on('connect', () => {
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('gameArea').style.display = 'flex';
                socket.emit('joinGame', myName); // طلب انضمام
            });

            socket.on('waitingForOpponent', () => {
                document.getElementById('status').innerText = "⏳ بانتظار لاعب آخر...";
            });

            socket.on('gameStart', (data) => {
                myRole = data.role;
                roomName = 'room_' + (myRole === 1 ? socket.id : socket.id); // اسم الغرفة
                document.getElementById('status').innerText = "🔥 بدأت اللعبة!";
                
                // تحديث لوحة الأسماء حسب دورك
                if(myRole === 2) {
                    document.getElementById('score2').innerText = `(أنت) 0`;
                    document.getElementById('score1').innerText = `0 (${data.opponentName})`;
                } else {
                    document.getElementById('score1').innerText = `(أنت) 0`;
                    document.getElementById('score2').innerText = `0 (${data.opponentName})`;
                }
            });

            // استقبال التحديثات من السيرفر وعرضها فورا!
            socket.on('gameState', (data) => {
                gameState = data;
                updateScores(data.p1.score, data.p2.score);
                draw();
            });

            // نهاية اللعبة
            socket.on('gameOver', (data) => {
                gameOver = true;
                if (data.winnerName === myName) {
                    document.getElementById('status').innerText = "🎉 مبروك الفوز!";
                } else {
                    document.getElementById('status').innerText = "💀 لقد خسرت!";
                    // إرسال رسالة تصبح على خير للمنتصر
                    socket.emit('chatMessage', { roomName: roomName, msg: `تصبح على خير يا ${data.winnerName} 😴`, sender: myName });
                }
            });

            socket.on('chatMessage', (data) => {
                alert(`رسالة من ${data.sender}:\n\n${data.msg}`);
            });

            // إذا الخصم حدث الصفحة أو فصل
            socket.on('opponentDisconnected', (data) => {
                gameOver = true;
                document.getElementById('status').innerText = "🏃‍♂️ هرب الخصم! لقد فزت.";
                alert("انسحب الخصم من المباراة!");
            });
        }

        // إرسال حركتك للسيرفر
        function sendMove(clientX, clientY) {
            if (gameOver || myRole === 0) return;
            const rect = canvas.getBoundingClientRect();
            let mx = (clientX - rect.left) * (canvas.width / rect.width);
            let my = (clientY - rect.top) * (canvas.height / rect.height);

            // حدود حركتك
            if (myRole === 1) {
                mx = Math.max(25, Math.min(canvas.width - 25, mx));
                my = Math.max(canvas.height/2 + 25, Math.min(canvas.height - 25, my));
            } else {
                mx = Math.max(25, Math.min(canvas.width - 25, mx));
                my = Math.max(25, Math.min(canvas.height/2 - 25, my));
            }

            // إرسال للسيرفر ليقوم بتعديل الفيزياء
            socket.emit('paddleMove', { roomName: roomName, role: myRole, x: mx, y: my });
        }

        canvas.addEventListener('mousemove', (e) => sendMove(e.clientX, e.clientY));
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); sendMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

        function updateScores(s1, s2) {
            let nameP1 = document.getElementById('score1').innerText.replace(/[0-9]/g, '').trim();
            let nameP2 = document.getElementById('score2').innerText.replace(/[0-9]/g, '').trim();
            document.getElementById('score1').innerText = (myRole === 1 ? `(أنت) ` : nameP1 + " ") + s1;
            document.getElementById('score2').innerText = (myRole === 2 ? `(أنت) ` : nameP2 + " ") + s2;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // خط المنتصف
            ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(400, 300);
            ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(200, 300, 50, 0, Math.PI * 2); ctx.stroke();

            // المرمى
            ctx.fillStyle = 'rgba(255, 0, 85, 0.2)'; ctx.fillRect(130, 0, 140, 10);
            ctx.fillStyle = 'rgba(0, 255, 204, 0.2)'; ctx.fillRect(130, 590, 140, 10);

            // اللاعب الأول (أزرق)
            ctx.beginPath(); ctx.arc(gameState.p1.x, gameState.p1.y, 25, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffcc'; ctx.fill();

            // اللاعب الثاني (أحمر)
            ctx.beginPath(); ctx.arc(gameState.p2.x, gameState.p2.y, 25, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0055'; ctx.fill();

            // القرص
            ctx.beginPath(); ctx.arc(gameState.puck.x, gameState.puck.y, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00'; ctx.fill();
        }
        draw();
    </script>
</body>
</html>
