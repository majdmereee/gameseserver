<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المافيا الذكية 🕵️‍♂️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ca143;
            --primary-light: #e6f9ed;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --night-bg: #111827;
            --night-surface: #1f2937;
            --day-bg: #f4f7f6;
            --day-surface: #ffffff;
            --text-dark: #111827;
            --text-light: #f9fafb;
            --radius: 16px;
            --transition: all 0.4s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background-color: var(--day-bg); 
            color: var(--text-dark); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; 
            transition: var(--transition);
        }

        body.night-mode {
            background-color: var(--night-bg);
            color: var(--text-light);
        }

        .container { 
            width: 95%; max-width: 800px; 
            background: var(--day-surface); 
            padding: 30px; 
            border-radius: var(--radius); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            transition: var(--transition);
            display: flex; flex-direction: column; gap: 20px;
        }

        body.night-mode .container {
            background: var(--night-surface);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        h1 { font-size: 2rem; font-weight: 900; color: var(--primary); text-align: center; }
        body.night-mode h1 { color: #34d399; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 700; font-size: 1rem; }
        
        input, select { 
            width: 100%; padding: 14px; border-radius: 12px; 
            border: 2px solid #e5e7eb; font-size: 1rem; outline: none; 
            background: transparent; color: inherit;
            transition: var(--transition);
        }
        
        body.night-mode input { border-color: #374151; }
        input:focus { border-color: var(--primary); }

        .btn { 
            padding: 16px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 900; 
            cursor: pointer; transition: transform 0.2s, filter 0.2s; 
            text-align: center; width: 100%;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn:active { transform: scale(0.98); }
        .btn-danger { background: var(--danger); }

        /* شاشات اللعبة */
        #gameScreen { display: none; flex-direction: column; gap: 20px; height: 80vh; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 2px solid #e5e7eb; }
        body.night-mode .header-bar { border-color: #374151; }
        
        .chat-box { 
            flex: 1; overflow-y: auto; padding: 15px; 
            background: var(--day-bg); border-radius: 12px; 
            display: flex; flex-direction: column; gap: 10px;
        }
        body.night-mode .chat-box { background: #111827; }

        .message { padding: 10px 15px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
        .msg-system { background: #e0f2fe; color: #0284c7; align-self: center; font-weight: bold; font-size: 0.9rem;}
        body.night-mode .msg-system { background: #1e3a8a; color: #93c5fd; }
        
        .msg-other { background: white; border: 1px solid #e5e7eb; align-self: flex-start; }
        body.night-mode .msg-other { background: #374151; border: none; }
        
        .msg-me { background: var(--primary-light); color: var(--primary); align-self: flex-end; }
        body.night-mode .msg-me { background: #064e3b; color: #34d399; }

        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; }
        .chat-input button { width: auto; padding: 0 25px; }

        .players-list { display: flex; gap: 10px; flex-wrap: wrap; }
        .player-badge { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; background: #f3f4f6; }
        body.night-mode .player-badge { background: #374151; }
        .player-dead { opacity: 0.5; text-decoration: line-through; color: var(--danger); }
    </style>
</head>
<body>

    <!-- شاشة الدخول (Lobby) -->
    <div class="container" id="loginScreen">
        <h1>المافيا 🕵️‍♂️</h1>
        <p style="text-align: center; color: var(--text-muted);">أدخل بياناتك للاتصال بالغرفة وتوليد البوتات</p>
        
        <div class="input-group">
            <label>مفتاح Gemini API (للبوتات):</label>
            <input type="password" id="apiKey" placeholder="AI.. أدخل مفتاحك هنا لتشغيل الـ">
        </div>

        <div class="input-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="playerName" placeholder="اكتب اسمك...">
        </div>

        <div class="input-group">
            <label>رقم الغرفة:</label>
            <input type="number" id="roomCode" placeholder="مثال: 99">
        </div>

        <button class="btn" onclick="joinLobby()">دخول الغرفة 🚀</button>
    </div>

    <!-- شاشة اللعبة -->
    <div class="container" id="gameScreen">
        <div class="header-bar">
            <div>
                <span style="font-weight: bold; font-size: 1.2rem;" id="uiPhase">☀️ النهار</span>
                <div style="font-size: 0.9rem; opacity: 0.8;" id="uiRole">دورك: جاري التوزيع...</div>
            </div>
            <button class="btn btn-danger" style="width: auto; padding: 8px 15px; font-size: 0.9rem;" onclick="hostStartGame()" id="startBtn">بدء اللعبة (توليد البوتات)</button>
        </div>

        <div class="players-list" id="playersListUI">
            <!-- قائمة اللاعبين تظهر هنا -->
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message msg-system">مرحباً بك في الغرفة! بانتظار البقية...</div>
        </div>

        <div class="chat-input" id="actionArea">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك للقرية..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const SERVER_URL = 'https://render-kr1o.onrender.com/';
        let socket;
        let myName, myRoom, apiKey;
        let players = [];
        let isHost = false; 
        let phase = 'waiting'; // waiting, day, night
        let myRole = 'مدني';

        // ==========================================
        // 1. نظام الاتصال وإدارة السيرفر الوهمي
        // ==========================================
        function joinLobby() {
            apiKey = document.getElementById('apiKey').value.trim();
            myName = document.getElementById('playerName').value.trim();
            myRoom = document.getElementById('roomCode').value.trim();

            if (!myName || !myRoom) return alert("أدخل الاسم ورقم الغرفة!");

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            players.push({ name: myName, type: 'human', alive: true });
            updatePlayersUI();

            socket = io(SERVER_URL, { transports: ['websocket'], upgrade: false });

            socket.on('connect', () => {
                appendMessage('system', 'تم الاتصال بسيرفر الألعاب بنجاح ✔️');
                // أول شخص يدخل الغرفة يعين نفسه "مضيف" لإدارة البوتات وحالة اللعبة
                if(players.length === 1) isHost = true;
                
                socket.emit('playerMoved', { type: 'join', room: myRoom, name: myName });
            });

            socket.on('otherPlayerMoved', (data) => {
                if (data.room !== myRoom) return;

                if (data.type === 'join' && data.name !== myName) {
                    if(!players.find(p => p.name === data.name)) {
                        players.push({ name: data.name, type: 'human', alive: true });
                        appendMessage('system', `انضم ${data.name} إلى الغرفة`);
                        updatePlayersUI();
                        // المضيف يرسل القائمة المحدثة
                        if(isHost) socket.emit('playerMoved', { type: 'sync_players', room: myRoom, players: players });
                    }
                }
                
                if (data.type === 'sync_players' && !isHost) {
                    players = data.players;
                    updatePlayersUI();
                }

                if (data.type === 'chat') {
                    appendMessage(data.name === myName ? 'me' : 'other', `${data.name}: ${data.message}`);
                }

                if (data.type === 'start_game') {
                    phase = 'day';
                    players = data.players; // تحديث مع البوتات
                    let me = players.find(p => p.name === myName);
                    myRole = me ? me.role : 'مراقب';
                    document.getElementById('uiRole').innerText = `دورك السري: ${myRole}`;
                    document.getElementById('startBtn').style.display = 'none';
                    appendMessage('system', 'بدأت اللعبة! تم توزيع الأدوار سراً.');
                    updatePlayersUI();
                }

                if (data.type === 'change_phase') {
                    phase = data.phase;
                    togglePhaseUI();
                }
            });
        }

        // ==========================================
        // 2. إدارة حالة اللعبة (للمضيف فقط)
        // ==========================================
        async function hostStartGame() {
            if (!isHost) return alert("فقط مؤسس الغرفة يمكنه بدء اللعبة!");
            if (!apiKey) return alert("بدون مفتاح API لا يمكن توليد البوتات الذكية!");

            document.getElementById('startBtn').innerText = 'جاري توليد البوتات ⏳...';
            document.getElementById('startBtn').disabled = true;

            // توليد بوتات لتعويض النقص حتى يصبح العدد 5
            let neededBots = 5 - players.length;
            const botNames = ["طارق (AI)", "سارة (AI)", "كمال (AI)", "نور (AI)"];
            
            for(let i=0; i < neededBots; i++) {
                players.push({ name: botNames[i], type: 'bot', alive: true });
            }

            // توزيع الأدوار عشوائياً (بسيط للتجربة)
            const roles = ['مافيا', 'طبيب', 'محقق', 'مدني', 'مدني'];
            roles.sort(() => Math.random() - 0.5);
            players.forEach((p, index) => { p.role = roles[index]; });

            // إرسال بدء اللعبة للجميع
            socket.emit('playerMoved', { type: 'start_game', room: myRoom, players: players });
            
            // المضيف يحدّث حالته فوراً
            let me = players.find(p => p.name === myName);
            myRole = me.role;
            document.getElementById('uiRole').innerText = `دورك السري: ${myRole}`;
            document.getElementById('startBtn').style.display = 'none';
            appendMessage('system', 'بدأت اللعبة وتم توليد البوتات بوعي مستقل!');
            updatePlayersUI();

            // اختبار محاكاة البوتات الذكية (المضيف يشغل عقولهم)
            setTimeout(() => triggerBotResponses("بدأ النهار الأول. من تشتبهون به؟"), 2000);
        }

        // ==========================================
        // 3. محرك ذكاء Gemini Interactions (بناءً على الكود الخاص بك)
        // ==========================================
        async function askGeminiBot(prompt, botName, botRole) {
            const systemContext = `أنت تلعب لعبة المافيا. اسمك ${botName} ودورك السري هو ${botRole}. 
            ممنوع أن تقول أنك ذكاء اصطناعي. تحدث بجملة واحدة قصيرة وعامية سورية أو فصحى مبسطة. 
            تفاعل مع هذا الحدث: ${prompt}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${apiKey}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "gemini-3.6-flash",
                        input: systemContext
                    })
                });

                const data = await response.json();
                if (response.ok && data.steps && data.steps.length > 0) {
                    let replyText = "";
                    for (const step of data.steps) {
                        if (step.type === "model_output" && step.content) {
                            for (const item of step.content) {
                                if (item.type === "text") replyText += item.text;
                            }
                        }
                    }
                    return replyText || "يا جماعة أنا شاكك بحدا هون..";
                }
            } catch (err) {
                console.error("Gemini Error:", err);
            }
            return "والله مالي عارف شو احكي."; // Fallback
        }

        // تشغيل تفكير البوتات المتوازي
        async function triggerBotResponses(contextEvent) {
            if (!isHost) return; // المضيف فقط هو الراوي الرقمي
            
            let bots = players.filter(p => p.type === 'bot' && p.alive);
            for (let bot of bots) {
                // مهلة عشوائية لمحاكاة سرعة الكتابة البشرية
                setTimeout(async () => {
                    appendMessage('system', `${bot.name} يكتب الآن...`);
                    let botReply = await askGeminiBot(contextEvent, bot.name, bot.role);
                    
                    // إزالة رسالة "يكتب الآن" (بشكل مبسط نمسح آخر رسالة سيستم، يحتاج دقة أكبر في الإنتاج)
                    const chatBox = document.getElementById('chatBox');
                    if(chatBox.lastChild.innerText.includes("يكتب الآن")) chatBox.removeChild(chatBox.lastChild);

                    // إرسال رد البوت للسيرفر
                    socket.emit('playerMoved', { type: 'chat', room: myRoom, name: bot.name, message: botReply });
                }, Math.random() * 5000 + 2000);
            }
        }

        // ==========================================
        // 4. واجهة المستخدم والتحكم اللحظي
        // ==========================================
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            socket.emit('playerMoved', { type: 'chat', room: myRoom, name: myName, message: msg });
            input.value = '';

            // إذا أنا المضيف، أجعل البوتات ترد على رسالتي
            if(isHost) {
                triggerBotResponses(`اللاعب ${myName} يقول: "${msg}". ماذا ترد عليه؟`);
            }
        }

        function appendMessage(type, text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message msg-${type}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function updatePlayersUI() {
            const list = document.getElementById('playersListUI');
            list.innerHTML = '';
            players.forEach(p => {
                let span = document.createElement('span');
                span.className = `player-badge ${p.alive ? '' : 'player-dead'}`;
                span.innerText = p.name;
                list.appendChild(span);
            });
        }

        // تبديل الليل والنهار تجريبياً (لإظهار قوة الواجهة)
        function togglePhaseUI() {
            if (phase === 'night') {
                document.body.classList.add('night-mode');
                document.getElementById('uiPhase').innerText = '🌙 الليل';
                appendMessage('system', 'حل الظلام.. المافيا تستيقظ 🤫');
            } else {
                document.body.classList.remove('night-mode');
                document.getElementById('uiPhase').innerText = '☀️ النهار';
                appendMessage('system', 'أشرقت الشمس.. وقت النقاش!');
            }
        }

        // أوامر للمضيف لاختبار الليل والنهار
        window.switchDayNight = () => {
            if(!isHost) return;
            let newPhase = phase === 'day' ? 'night' : 'day';
            socket.emit('playerMoved', { type: 'change_phase', room: myRoom, phase: newPhase });
        }
    </script>
</body>
</html>
